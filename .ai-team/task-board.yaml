  - id: SEIP-P1-004
    title: "P1 — identity slice 2: web sign-in through Keycloak behind the BFF (CCR-018, ADR-0014 §4)"
    status: review              # 2026-10-13 — CI green (run 38328163583), incl. dart client + mobile + e2e sso
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P1-003]
