      redirect guard on return_to; state, PKCE and ID-token nonce bind the
      callback to the browser. SPA: SEIP ID button (shown when the build sees
      KEYCLOAK_ISSUER + WEB_PUBLIC_ORIGIN), CSRF header on writes, no token in
      JS for cookie sessions, step-up banner on AUTH-006 linking to
      webLogin?acr=mfa. The password/bearer path stays until the end of P1.
