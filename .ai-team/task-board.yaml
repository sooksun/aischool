      - Security baseline + finding severity model created

  - id: SEIP-QA-002
    title: Adversarial cross-agent design review
    status: cancelled           # ADR-0004 — absorbed into self-review + user approval
    work_order: .ai-team/work-orders/SEIP-QA-002.md

  - id: SEIP-ARCH-002
    title: Ratify and lock contracts v1.0 (Sprint 0 exit gate)
