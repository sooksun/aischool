      - "contract 4.1.0 additive; gate:contracts green; oasdiff 4.0.0→4.1.0 no breaking"            # DONE
      - "httpOnly session + readable CSRF cookie; only hashes stored; refresh token sealed"           # DONE — web-session.test
      - "writes without / with a foreign X-CSRF-Token → AUTH-007"                                     # DONE
      - "tampered state, missing state cookie, off-site return_to never sign anyone in"               # DONE
