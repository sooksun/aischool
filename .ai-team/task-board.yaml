      allow_mobile_data for the item (the whole group) and is stored with the queue. The
      held-for-Wi-Fi flag itself is not stored, since it depends on the network now. Not
      done: a settings screen to change the 50 MB limit, and re-draining automatically
      when Wi-Fi returns (with background drain).
    acceptance_criteria:
      - "metered: big waits, small goes; allow -> big goes"  # DONE — outbox_test
      - "allow_mobile_data survives a restart"              # DONE
      - "widget: รอ Wi-Fi + ใช้เน็ตมือถือ"                    # DONE — capture_flow_test

  - id: SEIP-P2-011
    title: "P2 — FR-003 the app shows a recording's length and warns (never stops) when it exceeds the category cap"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P2-004]
    decisions: [ADR-0016, ADR-0003]
    primary_paths:
      - apps/mobile/lib/src/screens.dart
      - apps/mobile/test/capture_flow_test.dart
    notes: >
      After a recording, the details dialog shows "ความยาว m:ss". It warns in Thai when
      that length exceeds the chosen category's max_duration_seconds. The cap is
      framework data, never a constant. Changing the category re-checks it. The person
      can still save: the server refuses at initiate (UPL-003) and on the measured
      length (SEIP-P2-005). Not done: a live timer while recording. That needs an
      in-app camera screen (the camera plugin) instead of the system camera through
      image_picker. Also not done: the one_take / seam pre-flight warning, and the
      shortest-cap fallback when no category is chosen.
    acceptance_criteria:
      - "length shown; warning only when over the category's cap"  # DONE — capture_flow_test

  - id: SEIP-P2-012
    title: "P2 — FR-002 scan a multi-page paper document in the app into one PDF per item"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P2-004]
    decisions: [ADR-0016]
    primary_paths:
      - apps/mobile/lib/src/capture.dart
      - apps/mobile/lib/src/screens.dart
      - apps/mobile/test/scan_pdf_test.dart
      - apps/mobile/android/app/src/main/AndroidManifest.xml
    notes: >
      A "สแกนเอกสาร" button opens the platform scanner through cunning_document_scanner
      (ML Kit on Android, VisionKit on iOS). The scanner does edge detection, cropping
      and perspective correction. pagesToPdf (package pdf, pure Dart, unit-tested) turns
      the pages into one PDF, one page per scan sized to its image. The PDF is written to
      the app's private outbox directory, the scanner's temp images are deleted, and it
      then rides the outbox like any capture. Android declares CAMERA; iOS already has
      NSCameraUsageDescription. NOT VERIFIED ON A DEVICE: there is no Android/iOS SDK in
      this environment and CI does not build the app, so the plugin and manifest are
      uncompiled. The first device build must confirm them (minSdk 24 matches the
      plugin's).
    acceptance_criteria:
      - "3 pages -> one PDF with 3 pages, landscape kept"  # DONE — scan_pdf_test
      - "scan on a real Android and iPhone"                 # OPEN — needs a device

  - id: SEIP-P2-013
    title: "P2 — FR-004 share to SEIP from other apps (Android); a shared link opens the link form"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P2-008, SEIP-P2-009]
    decisions: [ADR-0016]
    primary_paths:
      - apps/mobile/lib/src/capture.dart
      - apps/mobile/lib/src/screens.dart
      - apps/mobile/test/capture_flow_test.dart
      - apps/mobile/android/app/src/main/AndroidManifest.xml
    notes: >
      receive_sharing_intent sits behind ShareInbox. Android declares SEND and
      SEND_MULTIPLE for */*. Shared files are taken as received, copied from the plugin's
      temp cache into the private outbox directory, and queued through the same path as a
      capture: one dialog, and several files become one item (FR-001 group). Shared text
      yields its first http(s) address (firstWebAddress, unit-tested), which opens the
      link form prefilled (FR-015). The home screen reads the launch share once (then
      reset) and listens while open. A share made while signed out is picked up after
      sign-in, because the plugin keeps it until read. NOT DONE: iOS. It needs a Share
      Extension target and an App Group in Xcode, which cannot be created or built here.
      NOT VERIFIED ON A DEVICE: the Android build and plugin are uncompiled in this
      environment.
    acceptance_criteria:
      - "widget: 2 shared photos -> one grouped item; shared link -> prefilled link form"  # DONE
      - "share from LINE / Drive / Photos on Android"                                      # OPEN — needs a device
      - "iOS Share Extension"                                                              # OPEN

  - id: SEIP-P2-014
    title: "P2 — FR-006 the outbox drains in the background (WorkManager) without racing the open app's token rotation"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P2-002, SEIP-P1-006]
    decisions: [ADR-0016, ADR-0014]
    primary_paths:
      - apps/mobile/lib/src/background.dart
      - apps/mobile/lib/src/api.dart
      - apps/mobile/lib/main.dart
      - apps/mobile/test/background_test.dart
    notes: >
      main() registers a periodic workmanager task: every 15 min, network connected, keep
      policy. The task restores the SEIP ID session from the keystore and drains the same
      SecureOutboxStore queue as the app (with the FR-008 Wi-Fi rule). Refresh tokens
      rotate with reuse detection (realm revokeRefreshToken, max reuse 0), so two
      guards apply. (1) The open app touches a foreground mark on every 30 s sync, and
      the task stands down for 2 min after it. (2) SeipSession._renew uses the token in
      the store rather than its in-memory copy, so a rotation made by the task is picked
      up. Signed out means the queue waits. The task never throws. drainInBackground is
      unit-tested (4 cases, including the rotation hand-over). NOT DONE: iOS
      registration (BGTaskSchedulerPermittedIdentifiers and the AppDelegate hook), and a
      device check that Android actually runs it; this environment cannot build the app.
    acceptance_criteria:
      - "closed app + signed in -> drained; app open -> stands down; signed out -> kept"  # DONE — background_test
      - "app renews with the rotated token from the store"                                # DONE
      - "runs on a real Android device; iOS BGTask registration"                          # OPEN

  - id: SEIP-P3-001
    title: "P3 v0 — analysis → suggestions → owner accepts, end to end on the local_heuristic floor (no GPU yet)"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P1-001, SEIP-P2-009]
    decisions: [ADR-0010, ADR-0015, ADR-0019]
    primary_paths:
      - prisma/migrations/20261014000100_ai_suggestions/migration.sql
      - packages/database/src/lib/heuristic-suggest.ts
      - packages/database/src/repositories/analysis.ts
      - apps/worker/src/jobs/evidence-analyze.ts
      - apps/worker/src/pdf-text.ts
      - apps/api/src/routes/analysis.ts
      - apps/web/src/components/SuggestionsPanel.tsx
      - tests/e2e/suggestions.spec.ts
    notes: >
      No contract change: the seven "analysis" operations, AI-002/003/004 and their
      permissions rows were already in contract 4.0.0, and now leave phase-gated.ts. New
      tables evidence_analysis, content_segment, ai_suggestion and suggestion_feedback
      each have an RLS backstop policy. A partial unique index allows one open
      suggestion per (evidence, indicator, framework version). A verified, scanned
      original queues evidence.analyze, and so does a new link or note. The worker
      extracts the PDF text layer page by page (pdf.js 6.3.289: no rendering, no fonts,
      no document scripts; control characters stripped). It ranks the owner's ว9/ว10
      indicators by the share of their content words found (a Thai stop-word list keeps
      ที่/และ/ผู้ from matching). Each suggestion gets a page locator whose quote
      validateQuote checks verbatim against the stored segment. The run finishes
      degraded + provisional, band never clear, calibrated_p null. Batch accept checks
      the role, then skips every item with AI-004 because no pre-tick gate has passed.
      calibrated_p, rationale_th and segment text are owner-only. Accept creates an
      owner_confirmed, ai_accepted mapping with locator_snapshot, which the director
      then validates as usual. Reject stores a reason. Re-runs are limited to once per
      10 min (AI-002, Retry-After). A deleted item's queued analysis finishes quietly.
      The e2e CI job now starts the worker (media off). NOT DONE: the GPU tier, its
      model, OCR and ASR (AQ-05). Also not done: the extract service (Office, images,
      video), PII redaction before the model (FR-023a), hidden-text and injection checks
      (FR-028), the calibration and gold set, and the suggestion inbox in the app.
    acceptance_criteria:
      - "Thai PDF → page segments, verbatim quote on the right page, degraded+provisional"  # DONE — worker file-process.test
      - "owner-only confidence/rationale; stranger RES-001; accept → ai_accepted mapping; AI-003; AI-004; AI-002"  # DONE — api analysis.test
      - "permission sweep covers all seven ops"                                               # DONE — test:security
      - "web: teacher accepts a suggestion for a note"                                       # DONE — e2e suggestions.spec

  - id: SEIP-P3-002
    title: "P3 — FR-023a mask national ids, phone numbers and emails before the mapper, in quotes, and in segments others read"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P3-001]
    decisions: [ADR-0010]
    primary_paths:
      - packages/database/src/lib/pii-redact.ts
      - packages/database/test/pii-redact.test.mjs
      - apps/worker/src/jobs/evidence-analyze.ts
      - apps/api/src/routes/analysis.ts
    notes: >
      No contract change. redactPii is rules only, with no model and no network. It
      masks 13-digit national ids, plain or grouped with space, dash or dot; Thai
      mobile and landline numbers, including +66; and emails. Thai digits count, and
      ids are matched before phones. Ordinary numbers stay: years, scores, times, and
      class sizes. The mapper gets masked text, so every quote, which the director
      and committee read, is masked. The stored segment keeps the original:
      listEvidenceSegments gives the owner the original and everyone else the masked
      text (before this, they got null). Not done: learner names, which need an
      in-country NER model; the ≥ 200-document recall benchmark the PRD asks for; and
      masking in the model input of the future GPU tier, which will reuse redactPii.
    acceptance_criteria:
      - "ids / phones / emails in every common shape masked; ordinary numbers kept"  # DONE — pii-redact.test
      - "quotes carry no PII; owner sees original segment, director masked"          # DONE — worker + api tests
      - "≥ 200-document Thai recall benchmark"                                        # OPEN

  - id: SEIP-P3-003
    title: "P3 — FR-028 flag items that may carry hidden instructions for the AI; only a school admin clears it (CCR-027)"
    status: review              # 2026-10-14
    branch: claude/remote-control-5aclif
    dependencies: [SEIP-P3-001]
    decisions: [ADR-0010, CCR-027]
    primary_paths:
      - packages/database/src/lib/injection-detect.ts
      - apps/worker/src/pdf-text.ts
      - apps/worker/src/jobs/evidence-analyze.ts
      - apps/api/src/routes/evidence.ts
      - apps/api/src/routes/analysis.ts
      - apps/web/src/pages/EvidenceDetailPage.tsx
      - prisma/migrations/20261014000200_injection_flag/migration.sql
      - docs/reviews/CCR-027-hidden-instruction-flag.md
    notes: >
      Additive, contract 4.9.0 / permissions 2.9.0. The rules-only detector (no model,
      no network) checks three things: zero-width and bidi characters (≥ 3);
      instruction wording addressed to an AI or asking for a score or blanket mapping,
      in Thai and English, read after the hidden characters are stripped so they
      cannot break up a phrase; and PDF text under 2 pt (≥ 20 characters, from pdf.js
      text transforms). Ordinary uses ("นักเรียนใช้ AI", "ครูให้คะแนนตาม rubric") are
      not flagged. The flag is stored on the evidence with the content hash it was
      found for, and a clear applies to that hash only. While flagged, nothing is
      batch-acceptable. The badge is shown to all readers. clearInjectionFlag is for
      the school admin only, never the owner, and is audited. Not done: comparing the
      text layer against an OCR of the rendered page (GPU tier); Office hidden
      sheets, QR codes and link snapshots (extract service); and step-up on clearing.
    acceptance_criteria:
      - "Thai/English instruction text, hidden chars, tiny text flagged; ordinary text not"  # DONE — injection-detect.test, worker test
      - "owner and director cannot clear; school admin clears with audit; same content stays cleared"  # DONE — api analysis.test
      - "permission sweep covers clearInjectionFlag"                                         # DONE — test:security

