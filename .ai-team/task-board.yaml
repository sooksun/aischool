    notes: >
      Contract 4.1.0 (additive; oasdiff: no breaking changes from 4.0.0):
      webLogin / webCallback / webLogout, webSession cookie scheme, X-CSRF-Token,
      AUTH-007; permissions 2.1.0, error-codes 2.1.0. Session row stores only
      SHA-256 of the cookie and of the CSRF token; the Keycloak refresh token is
      AES-256-GCM sealed (key from JWT_SECRET via HKDF). 30 min idle, 8 h max.
      At most once a minute a request refreshes against Keycloak; invalid_grant
      ends the web session (revocation ≤ ~60 s), an unreachable Keycloak does
      not (availability over revocation, logged). A new sign-in (step-up)
