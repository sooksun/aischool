# Single-agent mode per ADR-0004 (2026-07-17): Claude Code is the sole developer.
# The user is the final approver. Multi-agent fields (per-agent branches, allowed
# paths, file locks, cross-agent reviewers) are retired — history in git.
# HARD CONSTRAINT: no production feature code until the Sprint 0 exit gate passes
# (docs/project/SPRINT-0.md, reinterpreted per ADR-0004).
sprint: 0
statuses: [backlog, ready, in_progress, review, done, blocked, cancelled]

tasks:
  - id: SEIP-OPS-001
    title: Bootstrap repository (git, layout, CI skeleton, GitHub)
    status: in_progress
    branch: ai/claude/SEIP-OPS-001-repo-bootstrap   # pre-ADR-0004 name, kept as pushed
    work_order: .ai-team/work-orders/SEIP-OPS-001.md
    notes: >
      Remaining per ADR-0004 rescope: merge to develop, prove CI green on GitHub,
      record recommended branch-protection settings for the user (protection
      itself is optional in solo mode and needs gh auth or web UI).
    acceptance_criteria:
      - Repo pushed to github.com/sooksun/aischool with main + develop
      - CLAUDE.md at root reflects ADR-0004 solo model
      - Ownership validator passes (functional-area map, no overlaps)
      - CI runs green on develop (verified via public API)

  - id: SEIP-ARCH-001
    title: Contracts v0.1 draft (openapi, permissions, error-codes, events)
    status: ready               # unblocked when OPS-001 done
    work_order: .ai-team/work-orders/SEIP-ARCH-001.md
    dependencies: [SEIP-OPS-001]
    acceptance_criteria:
      - openapi.yaml events.yaml permissions.yaml error-codes.yaml drafted at v0.1
      - Roles + school-scoped tenancy in permissions.yaml
      - Indicator taxonomy per ADR-0003 / architecture/evaluation-framework.md
      - OpenAPI lints clean; type generation runs
      - AI-mapping endpoints explicitly deferred to Sprint 2
      - Resolves CCR-001 (filed by codex pre-ADR-0004)

  - id: SEIP-DB-000
    title: Data model proposal (ERD + entity dictionary, no schema)
    status: review              # claude reviews the inherited design
    work_order: .ai-team/work-orders/SEIP-DB-000.md
    notes: >
      Produced by Codex before ADR-0004 (out-of-wave user dispatch; honest
      handoff at .ai-team/handoffs/SEIP-DB-000.md). Claude inherits ownership,
      reviews during ARCH-001, and amends the feasibility verdict there.
    acceptance_criteria:
      - Claude review pass against evaluation-framework.md implications
      - Consistency with contracts v0.1 confirmed in ARCH-001

  - id: SEIP-UI-000
    title: Evidence submission UX flow (design, no implementation)
    status: ready               # can run alongside or after ARCH-001
    work_order: .ai-team/work-orders/SEIP-UI-000.md
    dependencies: [SEIP-ARCH-001]
    acceptance_criteria:
      - Teacher submits evidence with minimal fields (mobile-first flow)
      - All screen states inventoried (empty/loading/error/upload-resume/denied)
      - Every UI field traced to a contract field
      - Accessibility intent documented

  - id: SEIP-QA-001
    title: Runnable QA and security gate baseline
    status: ready
    work_order: .ai-team/work-orders/SEIP-QA-001.md
    dependencies: [SEIP-OPS-001]
    acceptance_criteria:
