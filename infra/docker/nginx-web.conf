# SPA static server (inside the web container). Upstream TLS/rate-limit lives
# in the edge proxy — see infra/nginx/seip-staging.conf.example.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API is not served from this container when edge nginx proxies /api to api:3001.
    # If this container is reached only via edge, /api never hits here.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
