# SPA static server (inside the web container). Upstream TLS/rate-limit lives
# in the edge proxy — see infra/nginx/seip-staging.conf.example (SEIP-OPS-004).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Baseline headers even if this container is hit without the edge proxy
    # (local compose publish of :8080). Edge adds HSTS when TLS terminates there.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
