      - extracting
      - perceiving
      - mapping
      - validating
      - succeeded
      - degraded
      - failed
      description: '`degraded` — finished on the heuristic floor (GPU unavailable or the evidence type is gated
        off); suggestions carry provisional=true.'
    Analysis:
      type: object
      required:
      - id
      - evidence_id
      - status
      - provisional
      - created_at
      properties:
        id:
          type: string
          format: uuid
        evidence_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        stage:
          type:
          - string
          - 'null'
        provisional:
          type: boolean
        eta_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        queue_position:
          type:
          - integer
          - 'null'
          minimum: 0
        error_code:
          type:
          - string
          - 'null'
          description: Stable error code when status=failed.
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    SuggestionStatus:
      type: string
      enum:
      - open
      - accepted
      - rejected
      - superseded
      - needs_review
    SuggestionBand:
      type: string
      enum:
      - clear
      - likely
      - possible
      description: Calibrated confidence band. Only `clear` suggestions on indicators whose pre-tick gate passed
        may be batch-accepted.
    Suggestion:
      type: object
      required:
      - id
      - evidence_id
      - indicator_id
      - indicator_code
      - framework_version_id
      - band
      - locators
      - provisional
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        evidence_id:
          type: string
          format: uuid
        indicator_id:
          type: string
          format: uuid
        indicator_code:
          type: string
        framework_version_id:
          type: string
          format: uuid
        support:
          type: string
          enum:
          - supports
          - partially_supports
        band:
          $ref: '#/components/schemas/SuggestionBand'
        locators:
          type: array
          items:
            $ref: '#/components/schemas/Locator'
        provisional:
          type: boolean
        model_label:
          type:
          - string
          - 'null'
          description: Human-readable model/pack label, e.g. "SEIP-Q fast". Never a vendor endpoint.
        prompt_version:
          type:
          - string
          - 'null'
        batch_acceptable:
          type: boolean
          description: True when band=clear AND the indicator's pre-tick gate has passed.
        calibrated_p:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: OWNER ONLY — null for every other caller.
        rationale_th:
          type:
          - string
          - 'null'
          description: OWNER ONLY — null for every other caller.
        status:
          $ref: '#/components/schemas/SuggestionStatus'
        created_at:
          type: string
          format: date-time
    SuggestionPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
        analysis:
          oneOf:
          - $ref: '#/components/schemas/Analysis'
          - type: 'null'
    SuggestionRejectReason:
      type: string
      enum:
      - not_relevant
      - wrong_indicator
      - weak_evidence
      - wrong_period
      - duplicate
      - other
    SuggestionReject:
      type: object
      required:
      - reason_code
      properties:
