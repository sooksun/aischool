openapi: 3.1.0
# version 4.3.0 — CCR-020 (additive): CurrentUser.memberships[].school_name, for the
#   school picker of a person who works at more than one school (FR-019).
# version 4.2.0 — CCR-019 (additive): importMembers — bulk onboarding from a staff
#   list (FR-091), with a dry run and a result per row.
# version 4.1.0 — CCR-018 (additive): web sign-in through Keycloak behind a BFF
#   (ADR-0014 §4): webLogin / webCallback / webLogout, the `webSession` cookie
#   security scheme (+ X-CSRF-Token on unsafe methods), AUTH-007.
# version 4.0.0 — CCR-017 (BREAKING, APPROVED by the owner 2026-10-12): person-owned
#   portfolio (ADR-0015), two-tier mapping confirmation, async in-country AI
#   analysis + suggestions (ADR-0010), resumable uploads (ADR-0016 §5), delta sync,
#   notifications, devices, coverage, committee evidence view, DPA/PA2/portfolio
#   exports (ADR-0017). Scoring and report approval are tagged x-seip-feature: v2.
#   Operations not yet served answer 501 SYS-003 until their phase (CCR-017 plan).
#   History of 1.x–3.x: git log -p docs/contracts/openapi.yaml.
info:
  title: SEIP API
  version: 4.3.0
  summary: School Evidence Intelligence Platform — core API (onboarding + agreements + evidence workflow + PA evaluation
    + reports/approval/AI + PDF)
  description: 'Contract v3.1 (CCR-016) — report approval. A director endorses a generated PA

    report, or returns it with a reason so it can be regenerated. Approval is only

    permitted once the round is closed, because scores stay mutable until then and

    a signature on mutable scores is a document that can contradict itself.


    v3.0 (CCR-015) — performance agreements (แบบ PA1) and ประเด็นท้าทาย.

    A teacher writes their own agreement, states the challenge they are taking on

    with its method and quantitative/qualitative targets, submits it, and the

    director acknowledges it. The committee then sees that text while scoring the

    three indicators that rate it — before v3.0 they scored 40% of the result

    blind. Breaking: `AssignmentCreate.agreement_id` is gone; the server derives it.


    v2.9 (CCR-014) — onboarding: a school_admin can invite people into

    their school and an invitee can set their own password. Until v2.9 the API

    could evaluate a teacher but could not create one. Note what is *not* here by

    design: creating the first admin, and creating schools/areas. Both need

    authority no role holds (area_admin is read-only across its area) and both

    ship as operator CLIs instead — CCR-014 decisions 1 and 2.


    v2.8 (CCR-013) — AssignmentDetail carries the evaluatee''s rank so

    scoring can show the seeded per-rank expected-practice text. v2.7 ScanStatus

    gains `unscanned`: a deployment with no malware scanner now says so instead of

    claiming `clean`. v2.6 typed

    ReportPayload; v2.5 lazy file download; v2.4 list scan_status; core remains

    evidence, PA evaluation, reports, AI suggest.


    **Business rules that bind every implementation**

    - Tenancy: every resource is school-scoped; cross-school access returns RES-001 (indistinguishable from not-found).

    - Taxonomy (frameworks/domains/indicators/weights) is versioned seed data — never hard-coded.

    - Scoring grain is per-evaluator (3 committee members); overall pass requires **every** evaluator ≥ 70% and
    the workload gate met.

    - Rounds are configurable 1..n per cycle; no endpoint assumes exactly 2.

    - Reports cite evidence by reference only (ReportSectionRef) — never embed file bytes.

    - PDF is generated from structured payload (not a pixel-perfect ก.ค.ศ. plate); suitable for draft/print review.

    - AI mapping suggestions always land as mapping_source=ai_suggested + status=suggested; human confirm required.

    - Error bodies follow error-codes.yaml; codes are stable API surface.


    **Deferred** — see `x-deferred`.



    **4.0.0 (CCR-017, DRAFT — not in force until the owner approves CCR-017).** Person-owned portfolio (ADR-0015),
    resumable uploads, async in-country AI analysis and suggestions (ADR-0010), two-tier mapping confirmation, offline
    sync, notifications, device sessions, coverage, committee evidence view and DPA/PA2 exports (ADR-0017). Operations
    tagged `x-seip-feature: v2` (scoring, report approval) stay in the contract but are excluded from the published
    v1 TS and Dart client bundles (ADR-0016 §8) and are served only when FEATURE_SCORING=true.'
  license:
    name: Proprietary — SEIP project internal
    url: https://github.com/sooksun/aischool
  contact:
    name: SEIP Architecture (Claude Code)
x-deferred:
  official-paper-signature-fidelity:
    reason: Pixel-perfect ก.ค.ศ. print plates remain a Protected Artifact; getReportPdf is structure-faithful SEIP
      layout
  cloud-ai-provider:
    reason: ADR-0007 forbids foreign/cloud LLM while ADR-0005 holds; local_heuristic is the only enabled path
  notifications:
    reason: Channel choice pending; events.yaml defines the triggering domain events
  additive-after-4.0.0: HR import (dry-run diff), custody transfer, consent records, rights requests, ROPA/audit
    export, controller-exit export, pa_round_record, framework amendments — each lands as an additive 4.x minor
    with its phase (P1–P5); none needs a breaking change.
servers:
- url: /api/v1
  description: Version-prefixed base path (host is deployment config)
security:
- bearerAuth: []
- webSession: []
tags:
- name: auth
  description: Authentication and session identity
- name: members
  description: School membership, personnel and invitations (school admin). School-scoped like every other resource
    — there is no cross-school write anywhere in this contract.
- name: taxonomy
  description: Read-only versioned indicator taxonomy (ADR-0003) and evidence categories
- name: cycles
  description: Evaluation cycle and round configuration (school admin)
- name: evidence
  description: Evidence metadata and two-phase file upload
- name: mappings
  description: Governed evidence↔indicator mappings (human-confirmed; AI may suggest)
- name: agreements
  description: Performance agreements (แบบ PA1) and ประเด็นท้าทาย — written by the evaluatee, acknowledged by the
    director
- name: scoring
  description: Committee assignments and per-evaluator scoring
- name: reports
  description: Structured PA report instances (payload JSON + evidence section refs)
- name: uploads
  description: 'Resumable evidence uploads: single PUT ≤16 MiB, S3 multipart above (ADR-0016 §5)'
- name: analysis
  description: Async in-country AI analysis, segments and suggestions (ADR-0010)
- name: sync
  description: Delta sync for offline clients (Flutter outbox)
- name: notifications
  description: In-app inbox and channel preferences
- name: devices
  description: Device sessions and push tokens
- name: coverage
  description: Indicator coverage for a person or school
- name: exports
  description: DPA Pack, PA2 workbook and portfolio exports (ADR-0017)
paths:
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a token pair
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ValidationError'
      x-seip-sunset: P1 — replaced by Keycloak OIDC + BFF session (ADR-0014)
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token into a new token pair (CCR-008, SEC-AUTH-2)
      description: 'The presented refresh token is the credential (no bearer header). On

        success the old token is revoked and a NEW pair is returned — the client

        must replace both stored tokens. Presenting an already-rotated (revoked)

        token is treated as a theft signal: every live token for that account is

        revoked and the request fails AUTH-001.

        '
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/ValidationError'
      x-seip-sunset: P1 — replaced by Keycloak OIDC + BFF session (ADR-0014)
  /auth/accept-invite:
    post:
      operationId: acceptInvite
      summary: Set the initial password for an invited account (CCR-014)
      description: 'The invite token in the body IS the credential — the invitee has no

        password yet and therefore cannot hold a bearer token. Single-use: the

        token is cleared in the same transaction that stores the password hash,

        and the account moves `invited` → `active`.


        Deliberately does NOT return a token pair. The caller logs in normally

        afterwards, so SEC-AUTH-3 (`invited` accounts cannot authenticate) stays

        enforced in exactly one place — `login`.


        Unknown, expired and already-used tokens are indistinguishable (AUTH-005),

        and the endpoint is throttled on the same limiter as login (SEC-AUTH-5),

        because the token is guessable in principle.

        '
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '204':
          description: Password set; the account is now active and may log in
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: AUTH-004 — too many attempts (SEC-AUTH-5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke refresh token(s) server-side (CCR-008, SEC-AUTH-2)
      description: 'With a `refresh_token` in the body, revokes that token (this session).

        Without one, revokes every live refresh token for the caller (logout

        everywhere). The short-lived access token is not blacklisted — it ages

        out within ACCESS_TOKEN_TTL_SECONDS.

        '
      tags:
      - auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Revoked (idempotent — also 204 if the token was already revoked)
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-seip-sunset: P1 — replaced by Keycloak OIDC + BFF session (ADR-0014)
  /auth/web/login:
    get:
      operationId: webLogin
      summary: Start a browser sign-in through Keycloak (CCR-018, ADR-0014 §4)
      description: 'Redirects to the realm''s authorization endpoint (code flow + PKCE)
        and sets a short-lived, signed `__Host-seip-oidc` cookie carrying state, nonce
        and verifier. `acr=mfa` asks for the second factor — the step-up after an
        AUTH-006.

        '
      tags:
      - auth
      security: []
      parameters:
      - name: return_to
        in: query
        required: false
        description: Same-site path to land on afterwards. Must start with a single `/`; anything else falls back to `/`.
        schema:
          type: string
          maxLength: 2000
      - name: acr
        in: query
        required: false
        schema:
          type: string
          enum:
          - pwd
          - mfa
          default: pwd
      responses:
        '302':
          description: To the Keycloak authorization endpoint
        '501':
          description: SYS-003 — web sign-in is not configured on this deployment (no Keycloak realm)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/web/callback:
    get:
      operationId: webCallback
      summary: Finish a browser sign-in (CCR-018)
      description: 'Checks state against the `__Host-seip-oidc` cookie, exchanges the code
        (confidential client, PKCE), verifies the ID token''s nonce and the access token,
        then starts a server-side session: `__Host-seip` (httpOnly, 30 min idle, 8 h
        maximum) and `__Host-seip-csrf` (readable by the page, echoed as X-CSRF-Token).
        Any failure redirects to `/login?error=sso` rather than showing a JSON error
        in the browser.

        '
      tags:
      - auth
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: To `return_to` on success, `/login?error=sso` otherwise
  /auth/web/logout:
    post:
      operationId: webLogout
      summary: End the browser session (CCR-018)
      description: 'Revokes the server-side session, ends the Keycloak session behind it
        and clears both cookies. Idempotent: 204 even without a live session.

        '
      tags:
      - auth
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Current user identity, memberships and roles
      tags:
      - auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /personnel:
    get:
      operationId: listPersonnel
      summary: Personnel of the caller's school (CCR-014)
      description: 'Resolves personnel UUIDs to names. Readable by `evaluator` as well as

        `director`/`school_admin` because a committee member must be able to see

        who they are scoring — before v2.9 four screens rendered raw UUIDs as

        primary user-facing text.


        Returns identity needed to pick and display a person, not their evaluation

        record — no scores, no agreements, no evidence.

        '
      tags:
      - members
      parameters:
      - name: status
        in: query
        description: Defaults to active only; pass `all` to include former personnel.
        schema:
          type: string
          enum:
          - active
          - inactive
          - all
          default: active
      - name: position_role
        in: query
        description: Filter to one framework family (ว9 teacher vs ว10 administrator).
        schema:
          $ref: '#/components/schemas/RoleFamily'
      responses:
        '200':
          description: Personnel of the caller's school
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonnelSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /members:
    get:
      operationId: listMembers
      summary: Accounts holding a membership in the caller's school (school admin)
      tags:
      - members
      parameters:
      - name: status
        in: query
        description: Defaults to current memberships (no effective_to in the past).
        schema:
          type: string
          enum:
          - current
          - all
          default: current
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: inviteMember
      summary: Invite a person into the caller's school (school admin)
      description: 'Creates the `UserAccount` (status `invited`, no password), the

        `SchoolMembership`, and — when `personnel` is present — the

        `PersonnelProfile`, in one transaction.


        The school is taken from the caller''s own membership and is NOT a body

        field. Accepting a client-supplied school id here would make this

        operation a cross-tenant account factory.


        `personnel` is optional because an external committee `evaluator` belongs

        to the school without being evaluated by it — the same reason

        `CurrentUser.personnel` is nullable (CCR-002).


        The returned `invite_token` is shown **once** and is not retrievable

        afterwards; the admin passes it to the invitee out of band. There is no

        email dependency by design: an on-prem deployment (ADR-0005) may have no

        SMTP relay at all.


        Inviting an email that already holds a current membership in this school

        is a conflict (RES-002), not a second membership.

        '
      tags:
      - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
      responses:
        '201':
          description: Invited — `invite_token` is returned exactly once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInviteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /members/import:
    post:
      operationId: importMembers
      summary: Invite many staff at once from a list, with a result per row (CCR-019, FR-091)
      description: 'The web reads the school''s CSV and sends its rows; each row is exactly
        a `MemberInvite` and goes through the same checks and the same transaction as
        `inviteMember`. Rows succeed or fail one by one: a bad row is reported with its
        error and the rest still go in. `dry_run: true` runs every check and writes
        nothing, so the admin can fix the file before anyone is invited. A row whose
        email repeats an earlier row in the same request is rejected (VAL-002).


        Like `inviteMember`, the school is the caller''s own, and invite tokens are
        returned once, here, and never again.

        '
      tags:
      - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberImport'
      responses:
        '200':
          description: One result per row, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /members/{membershipId}/end:
    post:
      operationId: endMembership
      summary: End a membership, revoking access to this school (school admin)
      description: 'Sets `effective_to` to today. Offboarding, not deletion — evaluation

        history stays intact and attributable.


        There is deliberately no way to backdate: `effective_to` records when

        access was actually revoked, and a past date would assert access ended

        earlier than it did.


        Idempotent — ending an already-ended membership returns it unchanged.

        '
      tags:
      - members
      parameters:
      - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Membership ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /frameworks:
    get:
      operationId: listFrameworks
      summary: List framework versions (ว9/ว10 revisions)
      tags:
      - taxonomy
      parameters:
      - name: role_family
        in: query
        schema:
          $ref: '#/components/schemas/RoleFamily'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - superseded
          - draft
      responses:
        '200':
          description: Framework versions (no nested taxonomy — keep list light)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Framework'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /frameworks/{frameworkId}:
    get:
      operationId: getFramework
      summary: One framework with its domain→indicator tree
      description: Per-rank rubric level descriptions are large; request them explicitly with `include=levels`.
      tags:
      - taxonomy
      parameters:
      - $ref: '#/components/parameters/FrameworkId'
      - name: include
        in: query
        description: Comma-separated expansions. `levels` adds IndicatorLevelDescription rows.
        schema:
          type: string
          enum:
          - levels
      responses:
        '200':
          description: Framework detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidence-categories:
    get:
      operationId: listEvidenceCategories
      summary: Evidence categories with upload validation metadata
      tags:
      - taxonomy
      responses:
        '200':
          description: Categories (framework-named evidence classes)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cycles:
    get:
      operationId: listCycles
      summary: List evaluation cycles of the caller's school
      tags:
      - cycles
      parameters:
      - name: fiscal_year
        in: query
        schema:
          type: integer
      - name: evaluation_kind
        in: query
        schema:
          $ref: '#/components/schemas/EvaluationKind'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CycleStatus'
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCycle
      summary: Create an evaluation cycle (school admin)
      tags:
      - cycles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /cycles/{cycleId}:
    get:
      operationId: getCycle
      summary: One cycle with its rounds
      tags:
      - cycles
      parameters:
      - $ref: '#/components/parameters/CycleId'
      responses:
        '200':
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCycle
      summary: Update cycle status/title/dates (school admin)
      tags:
      - cycles
      parameters:
      - $ref: '#/components/parameters/CycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CyclePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /cycles/{cycleId}/rounds:
    post:
      operationId: createRound
      summary: Add a round to a cycle (rounds are 1..n, data-driven)
      tags:
      - cycles
      parameters:
      - $ref: '#/components/parameters/CycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /rounds/{roundId}:
    patch:
      operationId: updateRound
      summary: Update round period or transition its status
      description: Legal transitions planned→open→scoring→closed (CYCLE-001). Closing freezes all scores (SCORE-002).
      tags:
      - cycles
      parameters:
      - $ref: '#/components/parameters/RoundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /evidence:
    get:
      operationId: listEvidence
      summary: List evidence (school-scoped; teachers see their own by default)
      tags:
      - evidence
      parameters:
