    EvidenceStatus:
      type: string
      enum:
      - draft
      - active
      - archived
      - rejected
    MappingStatus:
      type: string
      enum:
      - owner_confirmed
      - validated
      - returned
      - revoked
      description: 'Two-tier confirmation (ADR-0015). The owner confirms (`owner_confirmed`); the director or an
        assigned committee member then `validated` or `returned` it. `revoked` frees the (evidence, indicator, framework
        version) slot. There is no `suggested` state: AI output lives in Suggestion until the owner accepts it.'
    MappingSource:
      type: string
      enum:
      - ai_accepted
      - manual
      description: '`ai_accepted` — created by acceptSuggestion(s); `manual` — created by createMapping.'
    ReportStatus:
      type: string
      enum:
      - draft
      - pending_approval
      - approved
      - issued
      - superseded
    ReportTemplateCode:
      type: string
      enum:
      - PA1_s
      - PA1_bs
      - PA2_s
      - PA2_bs
      - PA3_s
      - PA3_bs
      description: PA form family × ส/บส variant (layout deferred; code selects payload shape)
    ScanStatus:
      type: string
      enum:
      - pending
      - clean
      - sanitised
      - unscanned
      - blocked
      description: '`pending` — queued, the worker has not processed the file yet.

        `clean` — a scanner ran and found nothing.

        `unscanned` — the file was processed but NO scanner ran, so the platform

        makes no claim about its contents (CCR-012). This is the state on any

        deployment without a malware scanner wired in. It is served like `clean`

        — the distinction is disclosure, not restriction — and clients are

        expected to surface it so nobody reads silence as a clean bill of health.

        `blocked` — quarantined: a scanner rejected it, or the stored object did

        not match the declared byte_size. Never served (UPL-006).

        `sanitised` — 4.0.0: the original failed or skipped scanning but a content-disarmed rendition (CDR) was
        produced and is what gets served (ADR-0018).

        '
