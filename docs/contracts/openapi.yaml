        entity_type:
          type:
          - string
          - 'null'
        entity_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        read_at:
          type:
          - string
          - 'null'
          format: date-time
    NotificationPage:
      type: object
