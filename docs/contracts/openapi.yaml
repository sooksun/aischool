        text:
          type:
          - string
          - 'null'
          description: Redacted text for non-owners; full text for the owner.
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    SegmentPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
