# SEIP HTTP API Contract
#
# Status: DRAFT v0.1 — NOT LOCKED. Locking happens in SEIP-ARCH-002.
# Owner: claude (architecture module)   Reviewer: grok
# Task: SEIP-ARCH-001
#
# Field names and enums are taken from
# docs/architecture/data-model/entity-dictionary.md. No field is invented here
# (contract-policy.md: "No implementation may invent fields outside an approved
# contract"). Where the data model is silent, the gap is recorded under
# x-seip-open-questions rather than filled with a guess.
#
# Authorization is defined in permissions.yaml, errors in error-codes.yaml.
# AUTHENTICATION IS NOT DECIDED — securitySchemes below is provisional (P-5).

openapi: 3.1.0

info:
  title: SEIP API
  version: 0.1.0-draft
  summary: School Evidence Intelligence Platform — evidence, governed mappings, PA/DPA evaluation
  description: |
    SEIP implements one principle: **upload once, reuse through governed
    mappings** (system-context.md). Evidence is stored once and reaches reports
    only through a confirmed `EvidenceIndicatorMapping` — never by file copy.

    ## Tenancy
    School is the tenant boundary. Collection endpoints are nested under
    `/schools/{schoolId}` so tenancy is explicit in every route. Single-resource
    endpoints are flat; the server resolves the owning school from the resource
    and applies the same check. See permissions.yaml §3.

    ## Framework data is versioned, not hard-coded
    The 15 teacher indicators (T-1.1…T-3.3) and 15 administrator indicators
    (A-1.1…A-5.2) are rows under a `FrameworkVersion`, read through
    `/framework-versions`. Clients must not embed indicator codes as constants.

    ## Scoring grain
    Scores are per `(assignment, indicator, evaluator)`. A pass requires **every**
    evaluator individually at ≥70% **and** the ภาระงาน boolean gate. No endpoint
    returns a single "pass" field computed across evaluators, because that would
    hide the rule.
  contact: {name: SEIP architecture (claude), url: 'https://github.com/sooksun/aischool'}
  license: {name: UNLICENSED, identifier: UNLICENSED}

servers:
  - url: 'https://api.seip.invalid/v0'
    description: Placeholder — no environment exists yet (no deployment task in Sprint 0)

tags:
  - {name: framework, description: Versioned indicator taxonomy (read-only reference data)}
  - {name: evidence, description: Evidence items and files}
  - {name: mapping, description: Governed evidence-to-indicator mappings}
  - {name: cycle, description: Evaluation cycles and configurable rounds}
  - {name: agreement, description: 'PA agreements, challenges and the workload gate'}
  - {name: scoring, description: 'Committees, per-evaluator scores and results'}
  - {name: report, description: PA1/PA2/PA3 reports and approvals}
  - {name: audit, description: Append-only audit trail}

security:
  - bearerAuth: []

paths:

  # ================================================================
  # Framework — global reference data, no school scope
  # ================================================================
  /framework-versions:
    get:
      tags: [framework]
      operationId: listFrameworkVersions
      summary: List framework versions (ว9/2564, ว10/2564, future revisions)
      parameters:
        - {name: role_family, in: query, schema: {$ref: '#/components/schemas/RoleFamily'}}
        - {name: status, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Framework versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/FrameworkVersion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /framework-versions/{frameworkVersionId}:
    parameters: [{$ref: '#/components/parameters/FrameworkVersionId'}]
    get:
      tags: [framework]
      operationId: getFrameworkVersion
      summary: Get one framework version with its domains
      responses:
        '200':
          description: Framework version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FrameworkVersionDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /framework-versions/{frameworkVersionId}/indicators:
    parameters: [{$ref: '#/components/parameters/FrameworkVersionId'}]
    get:
      tags: [framework]
      operationId: listIndicators
      summary: List indicators, optionally with per-วิทยฐานะ rubric descriptions
      parameters:
        - {name: indicator_kind, in: query, schema: {$ref: '#/components/schemas/IndicatorKind'}}
        - name: include_level_descriptions
          in: query
          description: Include IndicatorLevelDescription rows for the given rank level.
          schema: {type: boolean, default: false}
        - name: rank_level_code
          in: query
          description: Required when include_level_descriptions is true.
          schema: {type: string}
      responses:
        '200':
          description: Indicators
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Indicator'}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /evidence-categories:
    get:
      tags: [framework]
      operationId: listEvidenceCategories
      summary: List evidence categories with their technical validation rules
      description: |
        Clients use `allowed_mime_csv` and `max_duration_seconds` to validate
        before upload. The server re-validates regardless
        (STORAGE_MIME_NOT_ALLOWED, STORAGE_DURATION_EXCEEDED).
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/EvidenceCategory'}}

  # ================================================================
  # Evidence
  # ================================================================
  /schools/{schoolId}/evidence:
    parameters: [{$ref: '#/components/parameters/SchoolId'}]
    get:
      tags: [evidence]
      operationId: listEvidence
      summary: List evidence in a school
      description: |
        Soft-deleted rows are excluded unless `include_deleted=true`, which
        requires an administrative role.
      parameters:
        - {name: owner_personnel_id, in: query, schema: {type: string, format: uuid}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/EvidenceStatus'}}
        - {name: include_deleted, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Evidence page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [evidence]
      operationId: createEvidence
      summary: Create an evidence item (metadata only; files are attached separately)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /evidence/{evidenceId}:
    parameters: [{$ref: '#/components/parameters/EvidenceId'}]
    get:
      tags: [evidence]
      operationId: getEvidence
      responses:
        '200':
          description: Evidence with files
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
    patch:
      tags: [evidence]
      operationId: updateEvidence
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceUpdate'}
      responses:
        '200':
          description: Updated
          content: {application/json: {schema: {$ref: '#/components/schemas/Evidence'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      tags: [evidence]
      operationId: deleteEvidence
      summary: Soft-delete evidence
      description: |
        Sets `deleted_at`. Binary bytes are not removed here — GC policy is
        open question M-3. Confirmed mappings citing this evidence are revoked
        as a side effect and emit evidence.mapping.revoked.
      responses:
        '204': {description: Soft-deleted}
        '409': {$ref: '#/components/responses/Conflict'}

  /evidence/{evidenceId}/files:
    parameters: [{$ref: '#/components/parameters/EvidenceId'}]
    post:
      tags: [evidence]
      operationId: initEvidenceFileUpload
      summary: Begin a file upload and receive a provider-agnostic upload target
      description: |
        **Provisional — depends on unresolved OPEN-4 (object storage choice).**

        Two-phase by design: the client declares metadata, the server validates
        it against the evidence category *before* any bytes move, then returns an
        opaque upload target. Validating after upload would mean paying to store
        files we then reject.

        `upload_target` is intentionally opaque: for `s3`/`gcs`/`azure_blob` it
        carries a pre-signed URL, for `local`/`minio` a server-side endpoint.
        Clients must not parse it.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceFileInit'}
      responses:
        '201':
          description: Upload target issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceFileUploadTarget'}
        '422':
          description: |
            Category validation failed — STORAGE_MIME_NOT_ALLOWED,
            STORAGE_DURATION_EXCEEDED, STORAGE_DURATION_REQUIRED.
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /evidence/{evidenceId}/files/{evidenceFileId}/complete:
    parameters:
      - {$ref: '#/components/parameters/EvidenceId'}
      - {$ref: '#/components/parameters/EvidenceFileId'}
    post:
      tags: [evidence]
      operationId: completeEvidenceFileUpload
      summary: Finalize an upload; server verifies checksum and queues the scan
      responses:
        '200':
          description: File recorded with scan_status=pending
          content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceFile'}}}
        '409':
          description: STORAGE_UPLOAD_EXPIRED
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '422':
          description: STORAGE_CHECKSUM_MISMATCH
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  /evidence/{evidenceId}/files/{evidenceFileId}/download:
    parameters:
      - {$ref: '#/components/parameters/EvidenceId'}
      - {$ref: '#/components/parameters/EvidenceFileId'}
    get:
      tags: [evidence]
      operationId: downloadEvidenceFile
      summary: Obtain a short-lived download URL
      description: |
        Returns a redirect to a time-limited URL rather than streaming bytes
        through the API. Blocked and still-scanning files are refused
        (STORAGE_SCAN_BLOCKED, STORAGE_SCAN_PENDING).

        This is the narrowest permission in the system: evidence is `sensitive`
        and may contain learner data. Whether `area_admin` reaches it at all is
        open question P-2.
      responses:
        '302': {description: Redirect to a short-lived storage URL}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: STORAGE_SCAN_PENDING or STORAGE_SCAN_BLOCKED
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  # ================================================================
  # Governed mappings
  # ================================================================
  /schools/{schoolId}/mappings:
    parameters: [{$ref: '#/components/parameters/SchoolId'}]
    get:
      tags: [mapping]
      operationId: listMappings
      parameters:
        - {name: evidence_id, in: query, schema: {type: string, format: uuid}}
        - {name: indicator_id, in: query, schema: {type: string, format: uuid}}
        - {name: cycle_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MappingStatus'}}
        - {name: mapping_source, in: query, schema: {$ref: '#/components/schemas/MappingSource'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Mappings page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Mapping'}}
    post:
      tags: [mapping]
      operationId: suggestMapping
      summary: Propose that evidence supports an indicator
      description: |
        Creates the mapping in `suggested`. The evidence owner may propose but
        not confirm — confirmation is a separate, separately-permissioned step
        (permissions.yaml, resource `mapping`). Clients cannot create
        `mapping_source=ai_suggested`; that is reserved for the Sprint 2
        pipeline.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MappingCreate'}}}
      responses:
        '201':
          description: Suggested
          content: {application/json: {schema: {$ref: '#/components/schemas/Mapping'}}}
        '409':
          description: CONFLICT_ACTIVE_MAPPING_EXISTS
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '422':
          description: FRAMEWORK_VERSION_MISMATCH, TENANT_CROSS_SCHOOL_REFERENCE
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  /mappings/{mappingId}/transitions:
    parameters: [{$ref: '#/components/parameters/MappingId'}]
    post:
      tags: [mapping]
      operationId: transitionMapping
      summary: Confirm, reject or revoke a mapping
      description: |
        Allowed transitions: `suggested -> confirmed | rejected`,
        `confirmed -> revoked`. Anything else is
        STATE_MAPPING_NOT_CONFIRMABLE. Only `confirmed` mappings are eligible
        for official reports (RULE_MAPPING_NOT_CONFIRMED).

        Modelled as one transition endpoint rather than three verbs so the
        status machine lives in one place and an illegal transition has one
        error path.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [confirm, reject, revoke]}
                rationale: {type: string, maxLength: 2000, description: Recorded on the mapping and in the audit event.}
      responses:
        '200':
          description: Transitioned
          content: {application/json: {schema: {$ref: '#/components/schemas/Mapping'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ================================================================
  # Cycles and rounds
  # ================================================================
  /schools/{schoolId}/cycles:
    parameters: [{$ref: '#/components/parameters/SchoolId'}]
    get:
      tags: [cycle]
      operationId: listCycles
      parameters:
        - {name: fiscal_year, in: query, schema: {type: integer}}
        - {name: evaluation_kind, in: query, schema: {$ref: '#/components/schemas/EvaluationKind'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CycleStatus'}}
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/EvaluationCycle'}}
    post:
      tags: [cycle]
      operationId: createCycle
      summary: Create a cycle, pinning a framework version
      description: |
        `framework_version_id` freezes the taxonomy for this cycle. Later
        activating a newer framework must not rewrite this cycle
        (entity-dictionary §10.2). The framework's `role_family` must match the
        personnel it will evaluate (FRAMEWORK_ROLE_FAMILY_MISMATCH).
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CycleCreate'}}}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationCycle'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /cycles/{cycleId}/rounds:
    parameters: [{$ref: '#/components/parameters/CycleId'}]
    get:
      tags: [cycle]
      operationId: listRounds
      responses:
        '200':
          description: Rounds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/EvaluationRound'}}
    post:
      tags: [cycle]
      operationId: createRound
      summary: Add a round to a cycle
      description: |
        Rounds are configurable 1..n. There is deliberately **no maximum of 2**
        in this contract: the PA committee evaluates formally once, while salary
        progression uses two. Hard-coding 2 was explicitly rejected
        (evaluation-framework.md implication 3).
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RoundCreate'}}}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationRound'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /rounds/{roundId}/transitions:
    parameters: [{$ref: '#/components/parameters/RoundId'}]
    post:
      tags: [cycle]
      operationId: transitionRound
      summary: Move a round between planned / open / scoring / closed
      description: |
        `close` is irreversible in this contract: once closed, all score and
        result writes are rejected with STATE_ROUND_CLOSED
        (entity-dictionary §10.4). There is no reopen action, because an
        undo path would make "immutable after close" untrue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [open, start_scoring, close]}
      responses:
        '200':
          description: Transitioned
          content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationRound'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  # ================================================================
  # Agreements, challenges, workload gate
  # ================================================================
  /cycles/{cycleId}/agreements:
    parameters: [{$ref: '#/components/parameters/CycleId'}]
    get:
      tags: [agreement]
      operationId: listAgreements
      parameters:
        - {name: personnel_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Agreements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PerformanceAgreement'}}
    post:
      tags: [agreement]
      operationId: createAgreement
      summary: Create a PA1 agreement for one personnel in this cycle
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgreementCreate'}}}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceAgreement'}}}
        '409':
          description: 'CONFLICT_DUPLICATE — unique on (cycle_id, personnel_id)'
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  /agreements/{agreementId}/challenges:
    parameters: [{$ref: '#/components/parameters/AgreementId'}]
    put:
      tags: [agreement]
      operationId: putAgreementChallenges
      summary: Replace the ส่วนที่ 2 challenge plan
      description: |
        Each entry targets an indicator with `indicator_kind=challenge`
        (T-C.1 / T-C.2.1 / T-C.2.2 for teachers, admin equivalents). A
        `standard` indicator here is RULE_INDICATOR_KIND_MISMATCH. Replace
        semantics, because the plan is one document the subject edits as a whole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AgreementChallengeInput'}}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgreementChallenge'}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /agreements/{agreementId}/submit:
    parameters: [{$ref: '#/components/parameters/AgreementId'}]
    post:
      tags: [agreement]
      operationId: submitAgreement
      summary: Submit the agreement (sets submitted_at)
      responses:
        '200':
          description: Submitted
          content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceAgreement'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /agreements/{agreementId}/workload-declarations:
    parameters: [{$ref: '#/components/parameters/AgreementId'}]
    post:
      tags: [agreement]
      operationId: declareWorkload
      summary: Declare the ภาระงาน boolean gate for a round
      description: |
        `workload_met=false` fails the evaluatee overall regardless of score
        (entity-dictionary §10.6). It is a boolean gate, never a scored
        indicator, and it is declared by the head — not by the evaluatee
        (permissions.yaml `workload_declaration`). Unique per
        `(agreement_id, round_id)`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkloadDeclarationCreate'}}}
      responses:
        '201':
          description: Declared
          content: {application/json: {schema: {$ref: '#/components/schemas/WorkloadDeclaration'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ================================================================
  # Committee and scoring
  # ================================================================
  /rounds/{roundId}/assignments:
    parameters: [{$ref: '#/components/parameters/RoundId'}]
    get:
      tags: [scoring]
      operationId: listAssignments
      parameters:
        - {name: evaluatee_personnel_id, in: query, schema: {type: string, format: uuid}}
        - name: mine
          in: query
          description: Restrict to assignments where the caller holds a committee seat.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/EvaluationAssignment'}}
    post:
      tags: [scoring]
      operationId: createAssignment
      summary: Create an evaluation instance for one evaluatee in this round
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentCreate'}}}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationAssignment'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /assignments/{assignmentId}/committee:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    put:
      tags: [scoring]
      operationId: putCommittee
      summary: Set the three committee seats
      description: |
        The framework requires exactly 3 evaluators with exactly one `chair`
        (ผอ.สถานศึกษา for teachers; the superior for administrators). Fewer than
        3 blocks scoring with RULE_COMMITTEE_INCOMPLETE; a missing or duplicate
        chair is RULE_COMMITTEE_CHAIR_REQUIRED.

        Replace semantics on all three seats at once, so the "exactly 3, one
        chair" invariant is checked in a single transaction instead of being
        briefly violated between calls.

        **Who may call this is open question P-3** — drafted as school_admin to
        keep committee composition out of the hands of the chair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: {$ref: '#/components/schemas/CommitteeMemberInput'}
      responses:
        '200':
          description: Committee set
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: {type: array, items: {$ref: '#/components/schemas/CommitteeMember'}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /assignments/{assignmentId}/scores:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    get:
      tags: [scoring]
      operationId: listScores
      summary: List scores visible to the caller
      description: |
        A seated evaluator sees its own seat's scores. An evaluatee's visibility
        before the round closes is open question P-4.
      parameters:
        - {name: evaluator_user_id, in: query, schema: {type: string, format: uuid}}
        - {name: indicator_kind, in: query, schema: {$ref: '#/components/schemas/IndicatorKind'}}
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Score'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [scoring]
      operationId: putScores
      summary: Record or revise the calling evaluator's scores
      description: |
        Upsert on `(assignment_id, indicator_id, evaluator_user_id)`. The
        evaluator is always the caller — the body carries no
        `evaluator_user_id`, because an endpoint that accepted one would invite
        writing another member's score. A seat may only write its own
        (PERM_NOT_COMMITTEE_MEMBER).

        Requires round status `scoring` (STATE_ROUND_NOT_SCORING) and a complete
        committee (RULE_COMMITTEE_INCOMPLETE). Rejected outright once the round
        is closed (STATE_ROUND_CLOSED).

        `rubric_level` is 1–4 against the expected practice level of the
        evaluatee's วิทยฐานะ. For challenge items the server derives
        `points_awarded` from the level (4=100%, 3=75%, 2=50%, 1=25% of the
        item max) using ScoreWeight data — the client never computes points.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ScoreInput'}}
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Score'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /assignments/{assignmentId}/results:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    get:
      tags: [scoring]
      operationId: listResults
      summary: Per-evaluator rollups plus the derived overall outcome
      description: |
        Returns one `RoundResult` per evaluator **and** an `overall` object.
        `overall.passed` is true only when every evaluator's
        `passed_individual_threshold` is true and `passed_workload_gate` is true
        (entity-dictionary §10.6, §10.7). The per-evaluator rows are always
        returned alongside it, so the aggregate can never be read without the
        evidence for it.
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultSet'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [scoring]
      operationId: computeResults
      summary: Compute or recompute rollups from recorded scores
      description: |
        Fails with RULE_SCORES_INCOMPLETE if any evaluator has not scored every
        scored indicator and challenge item, and with
        RULE_WORKLOAD_GATE_NOT_DECLARED if the gate is missing for the round.
      responses:
        '200':
          description: Computed
          content: {application/json: {schema: {$ref: '#/components/schemas/ResultSet'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  # ================================================================
  # Reports and approvals
  # ================================================================
  /schools/{schoolId}/reports:
    parameters: [{$ref: '#/components/parameters/SchoolId'}]
    get:
      tags: [report]
      operationId: listReports
      parameters:
        - {name: cycle_id, in: query, schema: {type: string, format: uuid}}
        - {name: subject_personnel_id, in: query, schema: {type: string, format: uuid}}
        - {name: template_code, in: query, schema: {$ref: '#/components/schemas/TemplateCode'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ReportStatus'}}
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Report'}}
    post:
      tags: [report]
      operationId: generateReport
      summary: Generate a PA1/PA2/PA3 report instance
      description: |
        The server assembles `payload` from pinned framework data, scores and
        **confirmed** mappings. Citing an unconfirmed mapping is
        RULE_MAPPING_NOT_CONFIRMED. The report never stores file bytes — only
        `ReportSectionRef` citations (entity-dictionary §10.8).

        The exact field inventory of the official PA1/PA2/PA3 forms is a
        Protected Artifact and is **not yet specified** (open question M-4), so
        `payload` is typed as an open object in v0.1 rather than guessed at.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReportCreate'}}}
      responses:
        '201':
          description: Generated
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportDetail'}}}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /reports/{reportId}:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get:
      tags: [report]
      operationId: getReport
      responses:
        '200':
          description: Report with section references
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportDetail'}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /reports/{reportId}/transitions:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    post:
      tags: [report]
      operationId: transitionReport
      summary: Move a report through its status machine
      description: |
        `draft -> pending_approval -> approved -> issued`, plus `supersede`.
        Only `draft` accepts payload edits (STATE_REPORT_NOT_EDITABLE).
        A correction after issue is a new report that supersedes the old one,
        never an in-place edit — the issued document must stay reproducible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [submit_for_approval, issue, supersede]}
                superseded_by_report_id: {type: string, format: uuid}
      responses:
        '200':
          description: Transitioned
          content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /reports/{reportId}/approvals:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get:
      tags: [report]
      operationId: listApprovals
      responses:
        '200':
          description: Approval steps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
    post:
      tags: [report]
      operationId: decideApproval
      summary: Record an approval decision
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionInput'}}}
      responses:
        '200':
          description: Decided
          content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}
        '409':
          description: STATE_APPROVAL_ALREADY_DECIDED
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  # ================================================================
  # Audit
  # ================================================================
  /schools/{schoolId}/audit-events:
    parameters: [{$ref: '#/components/parameters/SchoolId'}]
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Read the append-only audit trail
      description: |
        Read-only: there is no write path for any role. `before_state` and
        `after_state` may contain PII snapshots, so access is restricted to
        administrative roles (permissions.yaml `audit`).
      parameters:
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: entity_id, in: query, schema: {type: string, format: uuid}}
        - {name: actor_user_id, in: query, schema: {type: string, format: uuid}}
        - {name: occurred_from, in: query, schema: {type: string, format: date-time}}
        - {name: occurred_to, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        '403': {$ref: '#/components/responses/Forbidden'}

# ====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        **PROVISIONAL — no authentication ADR exists** (permissions.yaml P-5).
        A bearer token is the least-committing placeholder that lets the rest of
        this contract be reviewed. Session cookies, OIDC and token format are
        all still open, and this block will change when that decision lands.
        Do not build an auth implementation against it.

  parameters:
    SchoolId: {name: schoolId, in: path, required: true, schema: {type: string, format: uuid}}
    FrameworkVersionId: {name: frameworkVersionId, in: path, required: true, schema: {type: string, format: uuid}}
    EvidenceId: {name: evidenceId, in: path, required: true, schema: {type: string, format: uuid}}
    EvidenceFileId: {name: evidenceFileId, in: path, required: true, schema: {type: string, format: uuid}}
    MappingId: {name: mappingId, in: path, required: true, schema: {type: string, format: uuid}}
    CycleId: {name: cycleId, in: path, required: true, schema: {type: string, format: uuid}}
    RoundId: {name: roundId, in: path, required: true, schema: {type: string, format: uuid}}
    AgreementId: {name: agreementId, in: path, required: true, schema: {type: string, format: uuid}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    ReportId: {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated key. Replaying the same key with the same body returns
        the original result; a different body is
        CONFLICT_IDEMPOTENCY_KEY_REUSED.
      schema: {type: string, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      description: ETag from a previous read. Mismatch is CONFLICT_STALE_WRITE.
      schema: {type: string}

  responses:
    Unauthorized:
      description: AUTH_REQUIRED
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: PERM_* or TENANT_SCOPE_MISMATCH
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: NOT_FOUND — also returned instead of a tenancy error when existence itself is sensitive
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Gone:
      description: STATE_EVIDENCE_DELETED
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: STATE_* / RULE_* / CONFLICT_*
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PreconditionFailed:
      description: CONFLICT_STALE_WRITE
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnprocessableEntity:
      description: VALID_* / RULE_* / FRAMEWORK_*
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ServiceUnavailable:
      description: STORAGE_PROVIDER_UNAVAILABLE / SYS_DEPENDENCY_UNAVAILABLE
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  schemas:

    # ---- errors and paging ----
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is from error-codes.yaml.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: Stable code from error-codes.yaml}
        detail: {type: string}
        instance: {type: string, format: uri}
        request_id: {type: string}
        retry_after_seconds: {type: integer}
        errors:
          type: array
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: {type: string, description: RFC 6901 JSON Pointer into the request body}
              code: {type: string}
              detail: {type: string}

    Page:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: [string, 'null']}

    # ---- enums (verbatim from entity-dictionary.md) ----
    RoleFamily: {type: string, enum: [teacher, administrator]}
    IndicatorKind: {type: string, enum: [standard, challenge, workload_gate]}
    DomainPart: {type: string, enum: [standards, challenge]}
    EvidenceStatus: {type: string, enum: [draft, active, archived, rejected]}
    ScanStatus: {type: string, enum: [pending, clean, blocked]}
    MappingStatus: {type: string, enum: [suggested, confirmed, rejected, revoked]}
    MappingSource: {type: string, enum: [human, ai_suggested]}
    EvaluationKind: {type: string, enum: [pa, dpa]}
    CycleStatus: {type: string, enum: [planned, open, closed]}
    RoundStatus: {type: string, enum: [planned, open, scoring, closed]}
    AssignmentStatus: {type: string, enum: [pending, in_progress, completed, void]}
    CommitteeRole: {type: string, enum: [chair, member]}
    RubricLevel: {type: integer, enum: [1, 2, 3, 4]}
    ReportStatus: {type: string, enum: [draft, pending_approval, approved, issued, superseded]}
    ApprovalDecision: {type: string, enum: [pending, approved, rejected, returned]}
    StorageProvider:
      type: string
      description: |
        Extensible by design — OPEN-4 has not selected a product, so this is not
        a closed enum.
      examples: [local, s3, gcs, azure_blob, minio]
    TemplateCode:
      type: string
      description: 'PA1/PA2/PA3 × ส (teacher) / บส (administrator).'
      enum: [PA1_s, PA1_bs, PA2_s, PA2_bs, PA3_s, PA3_bs]

    # ---- framework ----
    FrameworkVersion:
      type: object
      required: [id, code, role_family, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, examples: ['W9-2564', 'W10-2564']}
        role_family: {$ref: '#/components/schemas/RoleFamily'}
        legal_ref: {type: string}
        revision_year: {type: integer}
        status: {type: string}
        effective_from: {type: string, format: date}
        effective_to: {type: [string, 'null'], format: date}

    FrameworkVersionDetail:
      allOf:
        - $ref: '#/components/schemas/FrameworkVersion'
        - type: object
          properties:
            domains: {type: array, items: {$ref: '#/components/schemas/EvaluationDomain'}}
            score_weights: {type: array, items: {$ref: '#/components/schemas/ScoreWeight'}}

    EvaluationDomain:
      type: object
      required: [id, code, name_th, part]
      properties:
        id: {type: string, format: uuid}
        framework_version_id: {type: string, format: uuid}
        code: {type: string}
        name_th: {type: string}
        sort_order: {type: integer}
        part: {$ref: '#/components/schemas/DomainPart'}

    Indicator:
      type: object
      required: [id, domain_id, code, name_th, indicator_kind, is_scored]
      properties:
        id: {type: string, format: uuid}
        domain_id: {type: string, format: uuid}
        code: {type: string, examples: ['T-1.2', 'A-3.1', 'T-C.2.1']}
        name_th: {type: string}
        sort_order: {type: integer}
        is_scored: {type: boolean}
        indicator_kind: {$ref: '#/components/schemas/IndicatorKind'}
        level_descriptions:
          type: array
          description: Present only when requested with a rank_level_code.
          items: {$ref: '#/components/schemas/IndicatorLevelDescription'}

    IndicatorLevelDescription:
      type: object
      required: [rank_level_code, rubric_level, expected_practice_th]
      properties:
        rank_level_code: {type: string}
        rubric_level: {$ref: '#/components/schemas/RubricLevel'}
        expected_practice_th: {type: string}

    ScoreWeight:
      type: object
      required: [weight_key, weight_value]
      properties:
        weight_key: {type: string, examples: ['part1', 'part2', 'challenge.method']}
        weight_value: {type: number, exclusiveMinimum: 0}
        notes: {type: [string, 'null']}

    EvidenceCategory:
      type: object
      required: [id, code, label_th, allowed_mime_csv, required_for_dpa]
      properties:
        id: {type: string, format: uuid}
        code:
          type: string
          enum: [lesson_plan_pdf, teaching_video_mp4, problem_inspiration_video_mp4, learner_outcome_digital, academic_work_pdf]
        label_th: {type: string}
        allowed_mime_csv: {type: string}
        max_duration_seconds: {type: [integer, 'null'], examples: [600]}
        required_for_dpa: {type: boolean}

    # ---- evidence ----
    Evidence:
      type: object
      required: [id, school_id, owner_personnel_id, category_id, title, status, created_at]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        owner_personnel_id: {type: string, format: uuid}
        uploaded_by_user_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        title: {type: string, maxLength: 500}
        description: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/EvidenceStatus'}
        captured_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}

    EvidenceDetail:
      allOf:
        - $ref: '#/components/schemas/Evidence'
        - type: object
          properties:
            files: {type: array, items: {$ref: '#/components/schemas/EvidenceFile'}}
            mapping_count:
              type: object
              description: Counts by mapping status, so a client can show reuse without a second call.
              additionalProperties: {type: integer}

    EvidenceCreate:
      type: object
      required: [owner_personnel_id, category_id, title]
      properties:
        owner_personnel_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        title: {type: string, maxLength: 500}
        description: {type: string}
        captured_at: {type: string, format: date-time}

    EvidenceUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 500}
        description: {type: [string, 'null']}
        captured_at: {type: [string, 'null'], format: date-time}
        status: {$ref: '#/components/schemas/EvidenceStatus'}

    EvidenceFile:
      type: object
      required: [id, evidence_id, storage_provider, content_type, byte_size, checksum_sha256, scan_status]
      properties:
        id: {type: string, format: uuid}
        evidence_id: {type: string, format: uuid}
        storage_provider: {$ref: '#/components/schemas/StorageProvider'}
        content_type: {type: string}
        byte_size: {type: integer, minimum: 0}
        checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        duration_seconds: {type: [integer, 'null'], minimum: 0}
        original_filename: {type: string}
        scan_status: {$ref: '#/components/schemas/ScanStatus'}
        uploaded_at: {type: string, format: date-time}
      description: |
        `storage_uri` is deliberately NOT exposed. It is an internal locator;
        clients obtain access through the download endpoint instead.

    EvidenceFileInit:
      type: object
      required: [content_type, byte_size, checksum_sha256, original_filename]
      properties:
        content_type: {type: string}
        byte_size: {type: integer, minimum: 0}
        checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        duration_seconds:
          type: integer
          minimum: 0
          description: Mandatory when the category sets max_duration_seconds (STORAGE_DURATION_REQUIRED).
        original_filename: {type: string, maxLength: 500}

    EvidenceFileUploadTarget:
      type: object
      required: [evidence_file_id, upload_target, expires_at]
      properties:
        evidence_file_id: {type: string, format: uuid}
        upload_target:
          type: object
          description: Opaque to clients. Shape depends on the provider chosen in OPEN-4.
          required: [method, url]
          properties:
            method: {type: string, enum: [PUT, POST]}
            url: {type: string, format: uri}
            headers: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}

    # ---- mapping ----
    Mapping:
      type: object
      required: [id, school_id, evidence_id, indicator_id, mapping_source, status, mapped_at]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        evidence_id: {type: string, format: uuid}
        indicator_id: {type: string, format: uuid}
        cycle_id: {type: [string, 'null'], format: uuid}
        mapping_source: {$ref: '#/components/schemas/MappingSource'}
        status: {$ref: '#/components/schemas/MappingStatus'}
        mapped_by_user_id: {type: string, format: uuid}
        confirmed_by_user_id: {type: [string, 'null'], format: uuid}
        rationale: {type: [string, 'null']}
        mapped_at: {type: string, format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}

    MappingCreate:
      type: object
      required: [evidence_id, indicator_id]
      properties:
        evidence_id: {type: string, format: uuid}
        indicator_id: {type: string, format: uuid}
        cycle_id:
          type: string
          format: uuid
          description: Scopes the mapping to one cycle. Omit for a cycle-agnostic link.
        rationale: {type: string, maxLength: 2000}

    # ---- cycle ----
    EvaluationCycle:
      type: object
      required: [id, school_id, framework_version_id, fiscal_year, evaluation_kind, status]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        framework_version_id: {type: string, format: uuid}
        fiscal_year: {type: integer, examples: [2569]}
        evaluation_kind: {$ref: '#/components/schemas/EvaluationKind'}
        title: {type: string}
        status: {$ref: '#/components/schemas/CycleStatus'}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}

    CycleCreate:
      type: object
      required: [framework_version_id, fiscal_year, evaluation_kind, starts_on, ends_on]
      properties:
        framework_version_id: {type: string, format: uuid}
        fiscal_year: {type: integer}
        evaluation_kind: {$ref: '#/components/schemas/EvaluationKind'}
        title: {type: string}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}

    EvaluationRound:
      type: object
      required: [id, cycle_id, round_number, status]
      properties:
        id: {type: string, format: uuid}
        cycle_id: {type: string, format: uuid}
        round_number: {type: integer, minimum: 1, description: No upper bound — rounds are 1..n.}
        purpose: {type: string, examples: ['pa_formal', 'salary_progression']}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        status: {$ref: '#/components/schemas/RoundStatus'}

    RoundCreate:
      type: object
      required: [round_number, period_start, period_end]
      properties:
        round_number: {type: integer, minimum: 1}
        purpose: {type: string}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}

    # ---- agreement ----
    PerformanceAgreement:
      type: object
      required: [id, school_id, cycle_id, personnel_id, form_variant, status]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        cycle_id: {type: string, format: uuid}
        personnel_id: {type: string, format: uuid}
        form_variant: {type: string, enum: [PA1_s, PA1_bs]}
        status: {type: string}
        submitted_at: {type: [string, 'null'], format: date-time}

    AgreementCreate:
      type: object
      required: [personnel_id, form_variant]
      properties:
        personnel_id: {type: string, format: uuid}
        form_variant: {type: string, enum: [PA1_s, PA1_bs]}

    AgreementChallenge:
      type: object
      required: [id, agreement_id, indicator_id]
      properties:
        id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        indicator_id: {type: string, format: uuid}
        method_plan: {type: string}
        quantitative_target: {type: string}
        qualitative_target: {type: string}

    AgreementChallengeInput:
      type: object
      required: [indicator_id, method_plan]
      properties:
        indicator_id: {type: string, format: uuid, description: Must be indicator_kind=challenge.}
        method_plan: {type: string}
        quantitative_target: {type: string}
        qualitative_target: {type: string}

    WorkloadDeclaration:
      type: object
      required: [id, agreement_id, round_id, workload_met, declared_by_user_id, declared_at]
      properties:
        id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        workload_met: {type: boolean}
        notes: {type: [string, 'null']}
        declared_by_user_id: {type: string, format: uuid}
        declared_at: {type: string, format: date-time}

    WorkloadDeclarationCreate:
      type: object
      required: [round_id, workload_met]
      properties:
        round_id: {type: string, format: uuid}
        workload_met: {type: boolean}
        notes: {type: string, maxLength: 2000}

    # ---- scoring ----
    EvaluationAssignment:
      type: object
      required: [id, school_id, round_id, evaluatee_personnel_id, agreement_id, status]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        evaluatee_personnel_id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        committee: {type: array, items: {$ref: '#/components/schemas/CommitteeMember'}}

    AssignmentCreate:
      type: object
      required: [evaluatee_personnel_id, agreement_id]
      properties:
        evaluatee_personnel_id: {type: string, format: uuid}
        agreement_id: {type: string, format: uuid}

    CommitteeMember:
      type: object
      required: [id, assignment_id, evaluator_user_id, committee_role, seat_number]
      properties:
        id: {type: string, format: uuid}
        assignment_id: {type: string, format: uuid}
        evaluator_user_id: {type: string, format: uuid}
        committee_role: {$ref: '#/components/schemas/CommitteeRole'}
        seat_number: {type: integer, enum: [1, 2, 3]}

    CommitteeMemberInput:
      type: object
      required: [evaluator_user_id, committee_role, seat_number]
      properties:
        evaluator_user_id: {type: string, format: uuid}
        committee_role: {$ref: '#/components/schemas/CommitteeRole'}
        seat_number: {type: integer, enum: [1, 2, 3]}

    Score:
      type: object
      required: [assignment_id, indicator_id, evaluator_user_id, rubric_level, scored_at]
      properties:
        assignment_id: {type: string, format: uuid}
        indicator_id: {type: string, format: uuid}
        indicator_kind: {$ref: '#/components/schemas/IndicatorKind'}
        evaluator_user_id: {type: string, format: uuid}
        rubric_level: {$ref: '#/components/schemas/RubricLevel'}
        points_awarded: {type: [number, 'null'], description: Server-derived from rubric_level and ScoreWeight data.}
        comment: {type: [string, 'null']}
        scored_at: {type: string, format: date-time}

    ScoreInput:
      type: object
      required: [indicator_id, rubric_level]
      properties:
        indicator_id: {type: string, format: uuid}
        rubric_level: {$ref: '#/components/schemas/RubricLevel'}
        comment: {type: string, maxLength: 4000}
      description: |
        No `evaluator_user_id`: the evaluator is always the authenticated
        caller. No `points_awarded`: the server derives points from the rubric
        level and framework weights, so a client cannot disagree with the
        framework.

    RoundResult:
      type: object
      required: [assignment_id, evaluator_user_id, part1_percent, part2_percent, total_percent, passed_workload_gate, passed_individual_threshold]
      properties:
        assignment_id: {type: string, format: uuid}
        evaluator_user_id: {type: string, format: uuid}
        part1_percent: {type: number, description: 'ส่วนที่ 1 — standards, 60 points of the framework total.'}
        part2_percent: {type: number, description: 'ส่วนที่ 2 — challenge, 40 points.'}
        total_percent: {type: number}
        passed_workload_gate: {type: boolean}
        passed_individual_threshold: {type: boolean, description: 'total_percent >= 70 for THIS evaluator.'}
        status: {type: string}
        computed_at: {type: string, format: date-time}

    ResultSet:
      type: object
      required: [per_evaluator, overall]
      properties:
        per_evaluator:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/RoundResult'}
        overall:
          type: object
          required: [passed, reason]
          properties:
            passed:
              type: boolean
              description: |
                True only if every evaluator's passed_individual_threshold is
                true AND passed_workload_gate is true. An average over
                evaluators is never used.
            reason:
              type: string
              enum: [passed, failed_workload_gate, failed_individual_threshold, incomplete]
            failing_evaluator_user_ids: {type: array, items: {type: string, format: uuid}}

    # ---- report ----
    Report:
      type: object
      required: [id, school_id, cycle_id, subject_personnel_id, template_code, status]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: string, format: uuid}
        cycle_id: {type: string, format: uuid}
        round_id: {type: [string, 'null'], format: uuid}
        subject_personnel_id: {type: string, format: uuid}
        template_code: {$ref: '#/components/schemas/TemplateCode'}
        status: {$ref: '#/components/schemas/ReportStatus'}
        generated_at: {type: string, format: date-time}

    ReportDetail:
      allOf:
        - $ref: '#/components/schemas/Report'
        - type: object
          properties:
            payload:
              type: object
              description: |
                Structured form data. **Field inventory not specified in v0.1**
                — the official PA1/PA2/PA3 layouts are a Protected Artifact and
                open question M-4. Typed as an open object rather than guessed.
              additionalProperties: true
            section_refs: {type: array, items: {$ref: '#/components/schemas/ReportSectionRef'}}

    ReportSectionRef:
      type: object
      required: [id, report_id, section_key]
      properties:
        id: {type: string, format: uuid}
        report_id: {type: string, format: uuid}
        evidence_id: {type: [string, 'null'], format: uuid}
        mapping_id: {type: [string, 'null'], format: uuid}
        section_key: {type: string}
        sort_order: {type: integer}
      description: Citation by reference only — a report never embeds file bytes.

    ReportCreate:
      type: object
      required: [cycle_id, subject_personnel_id, template_code]
      properties:
        cycle_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        subject_personnel_id: {type: string, format: uuid}
        template_code: {$ref: '#/components/schemas/TemplateCode'}

    Approval:
      type: object
      required: [id, report_id, approver_user_id, step_code, decision]
      properties:
        id: {type: string, format: uuid}
        report_id: {type: string, format: uuid}
        approver_user_id: {type: string, format: uuid}
        step_code: {type: string}
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
        comment: {type: [string, 'null']}
        decided_at: {type: [string, 'null'], format: date-time}

    ApprovalDecisionInput:
      type: object
      required: [step_code, decision]
      properties:
        step_code: {type: string}
        decision: {type: string, enum: [approved, rejected, returned]}
        comment: {type: string, maxLength: 4000}

    # ---- audit ----
    AuditEvent:
      type: object
      required: [id, action, entity_type, entity_id, occurred_at]
      properties:
        id: {type: string, format: uuid}
        school_id: {type: [string, 'null'], format: uuid}
        actor_user_id: {type: [string, 'null'], format: uuid}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        before_state: {type: [object, 'null'], additionalProperties: true}
        after_state: {type: [object, 'null'], additionalProperties: true}
        request_id: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}

# ====================================================================
x-seip-open-questions:
  - id: A-1
    question: Authentication mechanism (session vs OIDC vs token format). securitySchemes is a placeholder.
    blocks: v1.0 lock
    owner: user + claude
  - id: A-2
    question: >
      Object storage product (OPEN-4). The two-phase upload and the opaque
      upload_target are shaped to survive the choice, but are unproven until
      one is made.
    blocks: evidence upload implementation
    owner: user + codex
  - id: A-3
    question: >
      Official PA1/PA2/PA3 field inventory (M-4). Report.payload is an open
      object until it is specified.
    blocks: report module
    owner: claude + user
  - id: A-4
    question: >
      No endpoints exist for School, UserAccount, SchoolMembership, Personnel
      or RankLevel administration. The entities are in the data model;
      onboarding flows were not drafted because no work order covers them.
    blocks: nothing in Sprint 1 scope — recorded so the gap is not mistaken for completeness
    owner: claude
  - id: A-5
    question: >
      No AI-mapping endpoints. Sprint 2 (OPEN-5 has no owning task).
      mapping_source=ai_suggested exists so the pipeline can write through the
      same governed path.
    blocks: Sprint 2
    owner: claude
  - id: A-6
    question: >
      DPA-specific flows are only partly covered. evaluation_kind=dpa exists on
      the cycle (M-2) but the ก.ค.ศ. submission path, the 2-vs-3 ด้าน rule and
      the ≥75% learner-coverage requirement have no endpoints.
    blocks: DPA support
    owner: claude + user
