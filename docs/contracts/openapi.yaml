        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: __Host-seip
      description: 'CCR-018 — the browser session the BFF sets after webCallback. On
        POST / PUT / PATCH / DELETE the request must also carry X-CSRF-Token equal to
        the `__Host-seip-csrf` cookie, or it is refused with 403 AUTH-007.

        '
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Double-submit token for a cookie session (CCR-018); the value of the `__Host-seip-csrf` cookie.
      schema:
        type: string
    FrameworkId:
      name: frameworkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgreementId:
      name: agreementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceSessionId:
      name: deviceSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. The server stores (actor, key, request hash, response) for 24 h and replays
        the original response for a retry with the same body; a different body with the same key fails IDEMP-001.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` the client last read, as a quoted ETag (e.g. `"7"`). Stale → 412 RES-004; missing
        → 428 RES-005.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page; omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: AUTH-* — missing/expired/invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: PERM-* — role or tenancy denial · AUTH-006 when the operation needs step-up authentication (acr
        ≥ 2) · AUTH-007 when a cookie-session write lacks a matching X-CSRF-Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: RES-001 — not found or cross-tenant (indistinguishable by design)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: VAL-001 — malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: VAL/UPL/MAP/SCORE/CYCLE-* — semantically invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: RES-002/MAP-001/UPL-004/CYCLE-002/SCORE-002 — state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: RES-004 — If-Match is stale (the resource changed since it was read)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionRequired:
      description: RES-005 — If-Match is required for this write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: AUTH-004 / AI-002 — throttled; see Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable code from error-codes.yaml
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required:
            - field
            - issue
            properties:
              field:
                type: string
              issue:
                type: string
        request_id:
          type: string
          format: uuid
    RoleFamily:
      type: string
      enum:
      - teacher
      - administrator
    Role:
      type: string
      enum:
      - teacher
      - director
      - deputy
      - evaluator
      - school_admin
      - area_admin
    UserStatus:
      type: string
      description: '`invited` — created but has never set a password; cannot authenticate

        (SEC-AUTH-3). `disabled` — deactivated; also cannot authenticate.

        '
      enum:
      - active
      - disabled
      - invited
    EvaluationKind:
      type: string
      enum:
      - pa
      - dpa
    CycleStatus:
      type: string
      enum:
      - planned
      - open
      - closed
    RoundStatus:
      type: string
      enum:
