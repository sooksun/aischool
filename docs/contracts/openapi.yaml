          $ref: '#/components/schemas/SuggestionRejectReason'
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    SuggestionBatchAccept:
      type: object
      required:
      - suggestion_ids
      properties:
        suggestion_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
    SuggestionBatchResult:
      type: object
      required:
      - accepted
      - skipped
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
        skipped:
          type: array
          items:
            type: object
            required:
            - suggestion_id
            - code
            properties:
              suggestion_id:
                type: string
                format: uuid
              code:
                type: string
                description: AI-003 / AI-004 / MAP-001
    UploadProtocol:
      type: string
      enum:
      - single_put
      - s3_multipart
    UploadCreate:
      type: object
      required:
      - evidence_id
      - filename
      - content_type
      - byte_size
      - checksum_sha256
      properties:
        evidence_id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
        checksum_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        duration_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: When the client can read it — lets the server warn before bytes move.
    PresignedRequest:
      type: object
      required:
      - url
      - method
      - expires_at
      properties:
        url:
          type: string
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    UploadSession:
      type: object
      required:
      - id
      - evidence_id
      - file_id
      - protocol
      - byte_size
      - part_size
      - part_count
      - status
      - expires_at
      - parts_received
      properties:
        id:
          type: string
          format: uuid
        evidence_id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/UploadProtocol'
        byte_size:
          type: integer
        part_size:
          type: integer
          description: 16 MiB for s3_multipart; equals byte_size for single_put.
        part_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - open
          - completing
          - completed
          - aborted
          - expired
        expires_at:
          type: string
          format: date-time
        single_put:
          oneOf:
          - $ref: '#/components/schemas/PresignedRequest'
          - type: 'null'
          description: Present only for protocol=single_put.
        parts_received:
          type: array
          items:
            type: integer
            minimum: 1
          description: Server-side ListParts; a resume starts at the first missing part.
    UploadPartUrlsRequest:
      type: object
      required:
      - part_numbers
      properties:
        part_numbers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 10000
          minItems: 1
          maxItems: 100
        checksums_sha256:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^[A-Za-z0-9+/]{43}=$
          minItems: 1
          maxItems: 100
          description: Optional base64 SHA-256 of each part, in the same order as part_numbers. When sent, each
            presigned request signs x-amz-checksum-sha256 and the store refuses a part whose bytes do not match.
            Whole-object integrity is always re-checked by the worker against checksum_sha256.
    UploadPartUrls:
      type: object
      required:
      - parts
      properties:
        parts:
          type: array
          items:
            type: object
            required:
            - part_number
            - request
            properties:
              part_number:
                type: integer
              request:
                $ref: '#/components/schemas/PresignedRequest'
      description: Each part PUT must send x-amz-checksum-sha256 (included in headers).
    UploadComplete:
      type: object
      required:
      - part_count
      properties:
        part_count:
          type: integer
          minimum: 1
      description: The server lists the parts and supplies their ETags to CompleteMultipartUpload — clients never
        read ETag headers.
    SyncEntity:
      type: string
      enum:
      - evidence
      - evidence_file
      - analysis
      - suggestion
      - mapping
      - notification
    SyncChange:
      type: object
      required:
      - entity
      - op
      - id
      - updated_at
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        op:
          type: string
          enum:
          - upsert
          - delete
        id:
          type: string
          format: uuid
        version:
          type:
          - integer
          - 'null'
        updated_at:
          type: string
          format: date-time
        evidence:
          oneOf:
          - $ref: '#/components/schemas/Evidence'
          - type: 'null'
        evidence_file:
          oneOf:
          - $ref: '#/components/schemas/EvidenceFile'
          - type: 'null'
        analysis:
          oneOf:
          - $ref: '#/components/schemas/Analysis'
          - type: 'null'
        suggestion:
          oneOf:
          - $ref: '#/components/schemas/Suggestion'
          - type: 'null'
        mapping:
          oneOf:
          - $ref: '#/components/schemas/Mapping'
          - type: 'null'
        notification:
          oneOf:
          - $ref: '#/components/schemas/Notification'
          - type: 'null'
      description: For op=upsert exactly the property named by `entity` carries the current row; for op=delete all
        entity properties are null.
    SyncChanges:
      type: object
      required:
      - changes
      - next_cursor
      - has_more
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor:
          type: string
        has_more:
          type: boolean
      description: Ordered by (updated_at, id). On conflict the server wins.
    NotificationKind:
