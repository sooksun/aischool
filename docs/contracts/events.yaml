# SEIP Domain Event Contract
# version: 1.0.0 — LOCKED by SEIP-ARCH-002 (2026-07-17); ratified by the user on merge of that PR.
# version: 1.1.0 — CCR-005 (additive): report.generated + ai.suggestion.created.
# version: 1.2.0 — CCR-012 (additive): evidence.file.scan_completed payload gains
#   scan_status=unscanned, emitted when no scanner ran (the previous stub reported
#   `clean` for everything it did not recognise by filename).
# version: 1.3.0 — CCR-016 (additive): report.approved moves OUT of `deferred:`
#   and gains a producer — the approval workflow now exists.
#
#   NOTE (CCR-016): the `version:` field below still read 1.1.0 when this change
#   was made. CCR-012 added its line to this log but never bumped the field, so
#   the two had been out of step since 2026-07-18. Corrected here to 1.3.0 (the
#   log is the record of what actually shipped). The 2026-07-19 audit called this
#   out as a real gap: these version headers are hand-maintained comments and
#   nothing asserts they match the field — unlike openapi.yaml, whose bump the
#   oasdiff gate checks. Worth a gate of its own.
# Protected contract (contract-policy.md): changes require a CCR + version bump.
# Adding an event or an optional payload field is additive (1.x); removing or
# retyping a field, or changing an event name, is breaking (2.0).
#
# Delivery: transactional OUTBOX (module-boundaries.md rule 4).
# The api/worker write the event row in the same DB transaction as the domain
# change; a dispatcher relays to consumers (notification, projections).
# No dual-writes inside request handlers.

version: 1.3.0
status: locked
locked_at: 2026-07-17

envelope:
  required:
    event_id: uuid            # unique per event
    event_type: string        # from `events` below, dot.case
    schema_version: integer   # per-event payload version, starts at 1
    occurred_at: iso8601      # domain time (transaction commit)
    school_id: uuid           # tenancy tag (nullable only for system events)
    actor_user_id: uuid|null  # who caused it (null = system/worker)
  optional:
    request_id: uuid          # correlates with API request + AuditEvent
  ordering: per-aggregate (evidence_id / assignment_id); consumers must be idempotent on event_id

events:
  evidence.created:
    payload: { evidence_id: uuid, owner_personnel_id: uuid, category_code: string }
    consumers: [audit-projection]

  evidence.file.registered:
    payload: { evidence_id: uuid, file_id: uuid, content_type: string, byte_size: integer }
    consumers: [scan-worker]
    note: Emitted by completeFileUpload; triggers async virus scan + video probe.

  evidence.file.scan_completed:
    payload: { evidence_id: uuid, file_id: uuid, scan_status: 'enum[clean, unscanned, blocked]' }
    consumers: [notification, audit-projection]
    note: >-
      blocked → file quarantined (UPL-006); owner notified. unscanned → processed
      but no scanner ran (CCR-012), served like clean; a notification consumer
      should not word this as "ปลอดภัย".

  evidence.mapping.suggested:
    payload: { mapping_id: uuid, evidence_id: uuid, indicator_id: uuid, mapping_source: 'enum[human, ai_suggested]' }
    consumers: [notification]
    note: Fired for both human createMapping and AI suggestMappings rows.

  evidence.mapping.confirmed:
    payload: { mapping_id: uuid, evidence_id: uuid, indicator_id: uuid, confirmed_by_user_id: uuid }
    consumers: [notification, audit-projection]

  evidence.mapping.rejected:
    payload: { mapping_id: uuid, evidence_id: uuid, indicator_id: uuid, rationale: string|null }
    consumers: [notification]

  evidence.mapping.revoked:
    payload: { mapping_id: uuid, evidence_id: uuid, indicator_id: uuid }
    consumers: [audit-projection]

  assignment.created:
    payload: { assignment_id: uuid, round_id: uuid, evaluatee_personnel_id: uuid, committee_user_ids: 'uuid[3]' }
    consumers: [notification]
    note: Notifies the 3 committee members.

  assignment.scores.submitted:
    payload: { assignment_id: uuid, evaluator_user_id: uuid, total_percent: number, passed_individual_threshold: boolean }
    consumers: [notification, audit-projection]
    note: Per-evaluator grain — fires once per evaluator submission (upsert replaces, re-fires with schema_version rules).

  assignment.completed:
    payload: { assignment_id: uuid, overall_pass: boolean, workload_gate_met: boolean }
    consumers: [notification, audit-projection]
    note: Fires when the 3rd evaluator submits and the workload gate is declared.

  round.closed:
    payload: { round_id: uuid, cycle_id: uuid, assignment_count: integer, completed_count: integer }
    consumers: [notification, audit-projection]
    note: After this, score writes are rejected (SCORE-002).

  report.generated:
    payload: { report_id: uuid, cycle_id: uuid, subject_personnel_id: uuid, template_code: string, status: 'enum[draft, pending_approval, approved, issued, superseded]' }
    consumers: [notification, audit-projection]
    note: Emitted by report.generate worker when payload + section_refs are written.

  ai.suggestion.created:
    payload: { evidence_id: uuid, mapping_ids: 'uuid[]', provider: 'enum[local_heuristic]', suggestion_count: integer }
    consumers: [notification, audit-projection]
    note: Batch summary after suggestMappings; individual rows also emit evidence.mapping.suggested.

  report.approved:
    payload: { report_id: uuid, cycle_id: uuid, subject_personnel_id: uuid, approver_user_id: uuid, step_code: string }
    consumers: [notification, audit-projection]
    note: >
      CCR-016. Emitted when a report transitions pending_approval → approved, in
      the same transaction as the status change and the Approval row. Carries the
      approver so a notification can name who signed.

      Only `approved` is an event. Returning a report for rework is deliberately
      NOT one: it is an internal step in a document's drafting, not something the
      rest of the system needs to react to, and every event declared without a
      consumer is a promise nobody keeps. NOTE that today outbox.dispatch is an
      acknowledged no-op, so this event is durably recorded and consumed by
      nothing — a known, separate gap, not something CCR-016 fixes.

deferred:
  notification.delivered: channel choice pending
