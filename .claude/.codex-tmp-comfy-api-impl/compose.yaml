name: comfyui-secure

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    image: comfyui:secured-20260720
    container_name: comfyui
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 60s
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    networks:
      - ai-net
    expose:
      - "8188"
    volumes:
      - /DATA/ComfyUI/custom_nodes:/app/custom_nodes
      - /DATA/ComfyUI/input:/app/input
      - /DATA/ComfyUI/models:/app/models
      - /DATA/ComfyUI/output:/app/output
    healthcheck:
      test:
        - CMD
        - /venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read()"
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s

  comfy-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: comfy-api:20260720
    container_name: comfy-api
    restart: unless-stopped
    depends_on:
      comfyui:
        condition: service_healthy
    networks:
      - ai-net
    expose:
      - "8000"
    secrets:
      - comfy_api_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export key="$$(cat /run/secrets/comfy_api_key)" &&
          python -c "import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/external-api/v1/health',
          headers={'Authorization':'Bearer '+os.environ['key']});
          urllib.request.urlopen(r,timeout=5).read()"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s

secrets:
  comfy_api_key:
    file: ./secrets/comfy_api_key

networks:
  ai-net:
    external: true
