# SEIP CI — gates per docs/qa/QUALITY-GATES.md (SEIP-QA-001)
# Pattern: LIVE gates run real commands today; SELF-ARMING gates check whether
# their subject exists (script/schema/tests) and activate automatically when
# Sprint 1 lands code — no future workflow edits needed.
# "Code owner review" is enforced by branch protection + CODEOWNERS, not a job.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ---------- LIVE gates ----------
  ownership:
    name: "Gate: module ownership"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run gate:ownership

  contract-compatibility:
    name: "Gate: contract compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract validity (lint + typegen + parse + authz coverage)
        # npm ci is required here even though validate-contracts.mjs's header says
        # "no repo dependencies required" — that was true when every check ran via
        # `npx --yes pkg@major`. Its later-added codegen-diff check shells out to
        # generate-contract-constants.mjs, which bare-imports js-yaml from
        # node_modules; this job never installed anything before that step existed.
        run: |
          npm ci
          npm run gate:contracts
      - name: Breaking-change check vs base
        # Runs on BOTH events: ADR-0004 sanctions committing straight to develop,
        # so a pull_request-only check would almost never execute in practice.
        # PR  -> compare against the target branch.
        # push -> compare against the commit the branch was at before this push.
        # scripts/security/check-contract-compatibility.mjs (not a bare oasdiff
        # call): a breaking change is allowed through when info.version's MAJOR
        # was actually bumped (contract-policy.md's documented process — CCR-004
        # found the original bare-oasdiff version of this step had no way to
        # honor that process at all, only to block every breaking change forever).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to diff against (new branch)"; exit 0
          fi
          mkdir -p /tmp/spec
          if ! git show "$BASE:docs/contracts/openapi.yaml" > /tmp/spec/base.yaml 2>/dev/null; then
            echo "::notice::openapi.yaml absent at $BASE — first introduction, nothing to diff"; exit 0
          fi
          cp docs/contracts/openapi.yaml /tmp/spec/head.yaml
          echo "diffing $BASE -> ${{ github.sha }}"
          node scripts/security/check-contract-compatibility.mjs /tmp/spec/base.yaml /tmp/spec/head.yaml

  secret-scan:
    name: "Gate: secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (pinned) over full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  dependency-audit:
    name: "Gate: dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit (arms via lockfile)
        run: |
          if [ -f package-lock.json ] || [ -f pnpm-lock.yaml ]; then
            npm run gate:dep-audit
          else
            echo "::notice::dependency-audit not yet armed — arms when a lockfile lands"
          fi

  # ---------- SELF-ARMING gates (activate when their subject exists) ----------
  format:
    name: "Gate: format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.format:check
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['format:check']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run format:check; else
            echo "::notice::format gate not yet armed — arms when scripts.format:check is defined (Sprint 1)"; fi

  lint:
    name: "Gate: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.lint
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['lint']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run lint; else
            echo "::notice::lint gate not yet armed — arms when scripts.lint is defined (Sprint 1)"; fi

  typecheck:
    name: "Gate: type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.typecheck
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['typecheck']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run typecheck; else
            echo "::notice::typecheck gate not yet armed — arms when scripts.typecheck is defined (Sprint 1)"; fi

  unit:
    name: "Gate: unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.test:unit
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['test:unit']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run test:unit; else
            echo "::notice::unit gate not yet armed — arms when scripts.test:unit is defined (Sprint 1)"; fi

  integration:
    name: "Gate: integration tests"
    runs-on: ubuntu-latest
    # These tests hit a real database (+ MinIO, since SEIP-API-001), so this gate
    # provides both. Runs on a MIGRATED + SEEDED database — distinct from
    # migration-validation, which runs the same DB-level suite on a from-zero,
    # unseeded DB. Together: migrations apply cleanly AND the seed produces a
    # working dataset the tests still pass against AND the real API/DB/storage
    # wiring works end-to-end (apps/api's evidence-flow.test.mjs).
    #
    # MinIO is NOT a `services:` entry (see the "Start MinIO" step below) — a
    # services container can't be given a command, and minio/minio's default
    # CMD just prints usage instead of starting the server; it requires an
    # explicit `server /data` argument. Verified locally: `--entrypoint sh`
    # (the previous approach here) overrides startup with a no-op shell that
    # exits immediately, so the server process never runs at all.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: seip_ci_root
          MYSQL_USER: seip
          MYSQL_PASSWORD: seip_ci
          MYSQL_DATABASE: seip
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pseip_ci_root"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: mysql://seip:seip_ci@localhost:3306/seip
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: seip-evidence
      S3_ACCESS_KEY: seip_ci
      S3_SECRET_KEY: seip_ci_only_change_me
      S3_REGION: us-east-1
      JWT_SECRET: ci-only-secret-not-a-real-credential-min32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 20); do
            if docker exec minio curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::minio did not become healthy in time"
          docker logs minio
          exit 1
      - name: Run if package.json defines scripts.test:integration
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['test:integration']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" != "true" ]; then
            echo "::notice::integration gate not yet armed — arms when scripts.test:integration is defined"; exit 0; fi
          npm ci
          npx --yes prisma@6 migrate deploy
          npx --yes prisma@6 generate
          node prisma/seed.mjs
          npm run test:integration
      - name: "Create the MinIO bucket (GH Actions services has no init-container equivalent)"
        run: |
          npm run build:libs
          npm run build --workspace apps/api
          # apps/api's reports-and-ai.test.mjs drives the REAL worker loop
          # (imports apps/worker/dist/loop.js) — without this build the whole
          # apps/api test step dies on ERR_MODULE_NOT_FOUND. Broken since the
          # REPORTS-AI merge; found while fixing the red develop runs (SEC-002).
          npm run build --workspace apps/worker
          node scripts/ci/ensure-minio-bucket.mjs
      - name: apps/api evidence-workflow integration tests
        run: npm run test:integration --workspace apps/api
      - name: packages/database repository integration tests
        run: npm run test:integration --workspace packages/database
      - name: apps/worker outbox/scan/duration/GC integration tests
        run: npm run test:integration --workspace apps/worker

  build:
    name: "Gate: build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.build
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['build']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run build; else
            echo "::notice::build gate not yet armed — arms when scripts.build is defined (Sprint 1)"; fi

  migration-validation:
    name: "Gate: migration validation"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: seip_ci_root
          MYSQL_USER: seip
          MYSQL_PASSWORD: seip_ci
          MYSQL_DATABASE: seip
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pseip_ci_root"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: mysql://seip:seip_ci@localhost:3306/seip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Arm only when a schema exists
        id: arm
        run: |
          if [ -f prisma/schema.prisma ]; then echo "armed=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::migration gate not yet armed — arms when prisma/schema.prisma lands"; fi
      - name: Validate schema
        if: steps.arm.outputs.armed == 'true'
        run: npx --yes prisma@6 validate
      - name: Apply migrations up (proves the up-path against a real MySQL)
        if: steps.arm.outputs.armed == 'true'
        run: npx --yes prisma@6 migrate deploy
        # No `migrate diff` drift check on purpose: the constraints migration adds
        # generated columns, CHECKs, partial indexes and triggers that Prisma's schema
        # language cannot represent, so diff(schema, migrations) always reports a
        # difference. The constraint tests below verify those objects exist and bite,
        # which is stronger than a structural diff would be anyway.
      - name: Constraint tests (the ว9/ว10 DB rules actually bite)
        if: steps.arm.outputs.armed == 'true'
        run: |
          npm install --no-save pg@8
          npm run test:backend

  permission-tests:
    name: "Gate: permission tests"
    runs-on: ubuntu-latest
    # Generated FROM permissions.yaml (SEC-TEN-5) against the real API, so it needs
    # the same MySQL + MinIO as the integration gate — see that job's comments
    # for why services has no compose-style init container, and why MinIO is
    # started as a manual step below rather than a `services:` entry.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: seip_ci_root
          MYSQL_USER: seip
          MYSQL_PASSWORD: seip_ci
          MYSQL_DATABASE: seip
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pseip_ci_root"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: mysql://seip:seip_ci@localhost:3306/seip
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: seip-evidence
      S3_ACCESS_KEY: seip_ci
      S3_SECRET_KEY: seip_ci_only_change_me
      S3_REGION: us-east-1
      JWT_SECRET: ci-only-secret-not-a-real-credential-min32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 20); do
            if docker exec minio curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::minio did not become healthy in time"
          docker logs minio
          exit 1
      - name: Run if tests/security has test files
        run: |
          if [ -z "$(find tests/security -type f ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::notice::permission gate not yet armed — arms when tests/security/* land (against permissions.yaml matrix)"; exit 0
          fi
          npm ci
          npx --yes prisma@6 migrate deploy
          npx --yes prisma@6 generate
          node prisma/seed.mjs
          npm run build:libs
          npm run build --workspace apps/api
          node scripts/ci/ensure-minio-bucket.mjs
          npm run test:security

  e2e-smoke:
    name: "Gate: e2e smoke"
    runs-on: ubuntu-latest
    # SEIP-QA-004: login → evidence list against real api+web+MySQL+MinIO.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: seip_ci_root
          MYSQL_USER: seip
          MYSQL_PASSWORD: seip_ci
          MYSQL_DATABASE: seip
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pseip_ci_root"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: mysql://seip:seip_ci@localhost:3306/seip
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: seip-evidence
      S3_ACCESS_KEY: seip_ci
      S3_SECRET_KEY: seip_ci_only_change_me
      S3_REGION: us-east-1
      JWT_SECRET: ci-only-secret-not-a-real-credential-min32
      PORT: "3011"
      # NODE_ENV deliberately NOT set at job level: `npm ci` under
      # NODE_ENV=production skips devDependencies, so the install/build step had
      # no tsc/vite/prisma CLI and this job failed before ever reaching
      # Playwright (broken since the job was added; found during SEC-002).
      # The API process gets NODE_ENV=production inline where it starts.
      E2E_BASE_URL: http://127.0.0.1:5173
      VITE_API_PROXY_TARGET: http://127.0.0.1:3011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 20); do
            if docker exec minio curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::minio did not become healthy"; docker logs minio; exit 1
      - name: Install, migrate, seed, build
        run: |
          npm ci
          npx --yes prisma@6 migrate deploy
          npx --yes prisma@6 generate
          node prisma/seed.mjs
          npm run build:libs
          npm run build --workspace apps/api
          npm run build --workspace apps/web
          node scripts/ci/ensure-minio-bucket.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start API and web
        run: |
          NODE_ENV=production node apps/api/dist/index.js &
          echo $! > /tmp/seip-api.pid
          npm run dev --workspace apps/web -- --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/seip-web.pid
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3011/api/v1/auth/login -X POST -H 'content-type: application/json' -d '{}' | grep -qE '4[0-9]{2}'; then
              echo "api up"; break
            fi
            sleep 2
          done
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              echo "web up"; exit 0
            fi
            sleep 2
          done
          echo "::error::web did not start"; exit 1
      - name: Run e2e smoke
        run: npm run test:e2e
