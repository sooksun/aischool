# SEIP CI skeleton — SEIP-OPS-001
# One job per PR gate in docs/qa/QUALITY-GATES.md. Stub jobs echo their pending
# status until SEIP-QA-001 supplies real commands; the ownership gate is live now.
# "Code owner review" is enforced by GitHub branch protection + CODEOWNERS, not a job here.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  ownership:
    name: "Gate: module ownership"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/orchestration/validate-ownership.mjs

  format:
    name: "Gate: format (stub)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "pending SEIP-QA-001 — see docs/qa/QUALITY-GATES.md"

  lint:
    name: "Gate: lint (stub)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "pending SEIP-QA-001 — see docs/qa/QUALITY-GATES.md"

  typecheck:
    name: "Gate: type check (stub)"
    runs-on: ubuntu-latest
    steps:
      - run: echo "pending SEIP-QA-001 — see docs/qa/QUALITY-GATES.md"

  unit:
