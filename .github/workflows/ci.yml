# SEIP CI — gates per docs/qa/QUALITY-GATES.md (SEIP-QA-001)
# Pattern: LIVE gates run real commands today; SELF-ARMING gates check whether
# their subject exists (script/schema/tests) and activate automatically when
# Sprint 1 lands code — no future workflow edits needed.
# "Code owner review" is enforced by branch protection + CODEOWNERS, not a job.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # ---------- LIVE gates ----------
  ownership:
    name: "Gate: module ownership"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run gate:ownership

  contract-compatibility:
    name: "Gate: contract compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract validity (lint + typegen + parse + authz coverage)
        run: npm run gate:contracts
      - name: Breaking-change check vs base
        # Runs on BOTH events: ADR-0004 sanctions committing straight to develop,
        # so a pull_request-only check would almost never execute in practice.
        # PR  -> compare against the target branch.
        # push -> compare against the commit the branch was at before this push.
        # Image pinned by digest per SECURITY-BASELINE SEC-REPO-2 (= oasdiff at 2026-07-17).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to diff against (new branch)"; exit 0
          fi
          mkdir -p /tmp/spec
          if ! git show "$BASE:docs/contracts/openapi.yaml" > /tmp/spec/base.yaml 2>/dev/null; then
            echo "::notice::openapi.yaml absent at $BASE — first introduction, nothing to diff"; exit 0
          fi
          cp docs/contracts/openapi.yaml /tmp/spec/head.yaml
          echo "diffing $BASE -> ${{ github.sha }}"
          docker run --rm -v /tmp/spec:/spec \
            tufin/oasdiff@sha256:e7f1b7531e9bbb12d61fc28c4d2a59896a47ee4fb8159eef0ff7aa76804acfb6 \
            breaking /spec/base.yaml /spec/head.yaml --fail-on ERR

  secret-scan:
    name: "Gate: secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (pinned) over full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  dependency-audit:
    name: "Gate: dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit (arms via lockfile)
        run: |
          if [ -f package-lock.json ] || [ -f pnpm-lock.yaml ]; then
            npm run gate:dep-audit
          else
            echo "::notice::dependency-audit not yet armed — arms when a lockfile lands"
          fi

  # ---------- SELF-ARMING gates (activate when their subject exists) ----------
  format:
    name: "Gate: format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.format:check
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['format:check']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run format:check; else
            echo "::notice::format gate not yet armed — arms when scripts.format:check is defined (Sprint 1)"; fi

  lint:
    name: "Gate: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.lint
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['lint']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run lint; else
            echo "::notice::lint gate not yet armed — arms when scripts.lint is defined (Sprint 1)"; fi

  typecheck:
    name: "Gate: type check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.typecheck
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['typecheck']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run typecheck; else
            echo "::notice::typecheck gate not yet armed — arms when scripts.typecheck is defined (Sprint 1)"; fi

  unit:
    name: "Gate: unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.test:unit
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['test:unit']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run test:unit; else
            echo "::notice::unit gate not yet armed — arms when scripts.test:unit is defined (Sprint 1)"; fi

  integration:
    name: "Gate: integration tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.test:integration
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['test:integration']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run test:integration; else
            echo "::notice::integration gate not yet armed — arms when scripts.test:integration is defined (Sprint 1)"; fi

  build:
    name: "Gate: build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if package.json defines scripts.build
        run: |
          ARMED=$(node -e "try{const s=require('./package.json').scripts||{};process.stdout.write(s['build']?'true':'false')}catch{process.stdout.write('false')}")
          if [ "$ARMED" = "true" ]; then npm ci && npm run build; else
            echo "::notice::build gate not yet armed — arms when scripts.build is defined (Sprint 1)"; fi

  migration-validation:
    name: "Gate: migration validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if prisma/schema.prisma exists
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx --yes prisma validate
          else
            echo "::notice::migration gate not yet armed — arms when prisma/schema.prisma lands (SEIP-DB-001)"
          fi

  permission-tests:
    name: "Gate: permission tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run if tests/security has test files
        run: |
          if [ -n "$(find tests/security -type f ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            npm ci && npm run test:security
          else
            echo "::notice::permission gate not yet armed — arms when tests/security/* land (against permissions.yaml matrix)"
          fi
