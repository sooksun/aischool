name: seip_api
description: >
  SEIP HTTP client for the Flutter app, generated from the OpenAPI contract by
  swagger_parser (ADR-0016 §3). Never hand-edit lib/src/generated.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.0
  json_annotation: ^4.12.0
  retrofit: ^4.9.0

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.0
  lints: ^6.0.0
  test: ^1.25.0
  retrofit_generator: ^10.2.0
  swagger_parser: ^1.45.0
