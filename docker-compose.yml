# SEIP local development stack (ADR-0012 PostgreSQL 18, ADR-0013 SeaweedFS).
# Dev only — staging uses docker-compose.staging.yml; production is RDS + S3 in
# ap-southeast-7 (ADR-0011). Credentials here are throwaway and intentionally
# obvious; never copy them to a real deployment (SEC-REPO-1).
#
#   docker compose up -d                 # postgres + seaweedfs (+ bucket)
#   npm run db:migrate && npm run db:seed
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: seip-postgres
    environment:
      POSTGRES_PASSWORD: seip_pg_dev_only
      POSTGRES_DB: seip
    ports:
      - "5432:5432"
    volumes:
      - seip-pg:/var/lib/postgresql
      # First boot only: create seip_migrator / seip_app (ADR-0012 §4) with the
      # dev passwords used in .env.example.
      - ./scripts/db/bootstrap-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seip"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (ADR-0013). MinIO's community images are gone.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seip-seaweedfs
    # Small volumes, fixed count: every bucket is a SeaweedFS collection with its
    # own volumes, and -volume.max=0 (auto from free disk) ran out after a handful
    # of buckets on a small dev/CI disk — PutObjectPart then fails with 500.
    # Caps dev storage at 6.4 GB. Staging keeps 1024 MB / auto.
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=64 -volume.max=100
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - seip-seaweedfs:/data
      - ./infra/seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer (403 for an anonymous request) means the S3 gateway is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the evidence bucket once, then exits. Mirrors what provisioning does.
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name seip-evidence' | weed shell -master=seaweedfs:9333 &&
      echo 'bucket seip-evidence ready (private)'
      "

  # Malware scanning (ADR-0009). Opt-in locally because the image pulls ~250 MB of
  # signatures and holds ~1 GB resident — most local work does not need it:
  #   docker compose --profile scan up -d clamav
  # then set SCAN_PROVIDER=clamav in .env. Without it, SCAN_PROVIDER stays `none`
  # and files are honestly reported `unscanned`, which is what they are.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.4
    container_name: seip-clamav
    ports:
      - "3310:3310"
    volumes:
      # Persist the signature database so a restart does not re-download it.
      - seip-clamav:/var/lib/clamav
    healthcheck:
      # Not just "is the port open": clamd accepts connections well before the
      # signature database is loaded, and a PING that early returns nothing.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      # ~2 minutes: first boot has to load the full signature set.
      retries: 12
      start_period: 120s

  # SEIP-WORKER-001 — host: npm run dev:worker (same .env DATABASE_URL/S3_*).
  # Optional container (build monorepo; prefer host during local dev):
  #   docker compose --profile worker up -d worker
  worker:
    profiles: ["worker"]
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://seip_app:seip_app_dev@postgres:5432/seip
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: seip-evidence
      S3_ACCESS_KEY: seip_ci
      S3_SECRET_KEY: seip_ci_only_change_me
      S3_REGION: us-east-1
      NODE_ENV: development
      WORKER_POLL_MS: "2000"
      WORKER_GC_AFTER_DAYS: "7"
    command: >
      sh -c "npm ci && npx prisma generate && npm run build:libs &&
      npm run build --workspace apps/worker &&
      node apps/worker/dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  seip-pg:
  seip-seaweedfs:
  seip-clamav:
