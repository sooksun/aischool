# SEIP local development stack (ADR-0005: same components as on-prem, different config).
# Dev only — production on-prem deployment gets its own compose/systemd with real
# secrets, TLS, and backups. Credentials here are throwaway and intentionally
# obvious; never copy them to a real deployment (SEC-REPO-1).
#
# ADR-0008: the dev DATABASE is the host's Laragon-managed MySQL 8 on :3306
# (root, no password) — no DB container here anymore. Only object storage runs
# in Docker. Staging/on-prem still containerize MySQL (docker-compose.staging.yml).
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: seip-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: seip_dev
      MINIO_ROOT_PASSWORD: seip_dev_only_change_me
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console UI
    volumes:
      - seip-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the evidence bucket once, then exits. Mirrors what on-prem provisioning does.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 seip_dev seip_dev_only_change_me &&
      mc mb --ignore-existing local/seip-evidence &&
      mc anonymous set none local/seip-evidence &&
      echo 'bucket seip-evidence ready (private)'
      "

  # Malware scanning (ADR-0009). Opt-in locally because the image pulls ~250 MB of
  # signatures and holds ~1 GB resident — most local work does not need it:
  #   docker compose --profile scan up -d clamav
  # then set SCAN_PROVIDER=clamav in .env. Without it, SCAN_PROVIDER stays `none`
  # and files are honestly reported `unscanned`, which is what they are.
  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.4
    container_name: seip-clamav
    ports:
      - "3310:3310"
    volumes:
      # Persist the signature database so a restart does not re-download it.
      - seip-clamav:/var/lib/clamav
    healthcheck:
      # Not just "is the port open": clamd accepts connections well before the
      # signature database is loaded, and a PING that early returns nothing.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      # ~2 minutes: first boot has to load the full signature set.
      retries: 12
      start_period: 120s

  # SEIP-WORKER-001 — host: npm run dev:worker (same .env DATABASE_URL/S3_*).
  # Optional container (build monorepo; prefer host during local dev):
  #   docker compose --profile worker up -d worker
  # Reaches the host's Laragon MySQL via host.docker.internal (ADR-0008).
  worker:
    profiles: ["worker"]
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: mysql://root@host.docker.internal:3306/seip
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: seip-evidence
      S3_ACCESS_KEY: seip_dev
      S3_SECRET_KEY: seip_dev_only_change_me
      S3_REGION: us-east-1
      NODE_ENV: development
      WORKER_POLL_MS: "2000"
      WORKER_GC_AFTER_DAYS: "7"
    command: >
      sh -c "npm ci && npx prisma generate && npm run build:libs &&
      npm run build --workspace apps/worker &&
      node apps/worker/dist/index.js"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  seip-minio:
  seip-clamav:
