# SEIP staging stack (SEIP-OPS-003) — same architecture as on-prem (ADR-0005),
# different config from dev. NO default secrets in this file: every credential
# comes from the host environment or an env_file that is gitignored (SEC-REPO-1).
#
# Usage:
#   1. Copy .env.staging.example → .env.staging and fill real values.
#   2. docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#   3. Put nginx (infra/nginx/seip-staging.conf.example) in front for TLS.
#
# Services: postgres + minio + api + worker + web.
# Dev stack remains docker-compose.yml (throwaway credentials, host ports).
# Do not copy staging secrets into the dev compose.

name: seip-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seip}
    volumes:
      - seip_staging_pgdata:/var/lib/postgresql/data
    # Staging: do not publish Postgres to the host by default. App containers
    # reach it on the internal network. Uncomment for emergency DBA access only.
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [seip_internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - seip_staging_minio:/data
    # Same rule as Postgres: keep S3 API off the public interface; nginx may
    # proxy only if you intentionally need browser-side console (usually no).
    # ports:
    #   - "127.0.0.1:9000:9000"
    #   - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [seip_internal]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-seip-evidence}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      mc anonymous set none \"local/$$S3_BUCKET\" &&
      echo \"bucket $$S3_BUCKET ready (private)\"
      "
    networks: [seip_internal]

  # Application processes — built from infra/docker Dockerfiles (same Node monorepo).
  # They share the internal network; only nginx (host or separate container) exposes
  # 443 to users.
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seip}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET min 32 chars}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-seip-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    # Bind localhost only if you must hit the API without nginx during bring-up.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      # TCP check only — avoids depending on a /health route (not required by contract).
      test:
        [
          "CMD-SHELL",
          "node -e \"const n=require('net');const s=n.connect(3001,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [seip_internal]

  # Async jobs: virus-scan stub, duration probe, outbox dispatch, storage GC,
  # and future report.generate / AI jobs (single worker process — WORKER-001).
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        # Prefer migrations to finish in api container before worker hammers schema
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seip}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-seip-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
      WORKER_GC_AFTER_DAYS: ${WORKER_GC_AFTER_DAYS:-7}
    # No host ports — worker is internal only
    networks: [seip_internal]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Empty = same-origin /api via nginx (recommended staging/on-prem shape).
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    networks: [seip_internal]

networks:
  seip_internal:
    driver: bridge

volumes:
  seip_staging_pgdata:
  seip_staging_minio:
